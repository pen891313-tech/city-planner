<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 도시 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1d2533; --sub:#5b6577; --line:#dfe4ec; --navy:#1f3864; --accent:#2e5395;
  --ok:#2e9e5b; --warn:#c0392b; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
a{color:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
header.top h1{font-size:18px;margin:0;font-weight:700;cursor:pointer;white-space:nowrap}
header.top .crumb{font-size:14px;opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .crumb a{text-decoration:none}
header.top .crumb a:hover{text-decoration:underline}
main{max-width:1440px;margin:0 auto;padding:18px 16px 60px}
.banner{background:#fff4d6;border:1px solid #f0d58a;color:#6b5200;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
h2{font-size:20px;margin:6px 0 14px;color:var(--navy)}
h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;padding:8px 12px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{background:#f0f3f8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#244579}
.btn.danger{color:var(--warn);border-color:#efc3bd}
.btn:disabled{opacity:.5;cursor:default}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grade h3{margin-top:0}
.classbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.classbtns a{padding:18px 0;font-size:17px}
.cityrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.cityrow input{font:inherit;font-size:17px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:200px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.team{border-left:6px solid var(--c);display:flex;flex-direction:column;gap:6px;text-decoration:none}
.team:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.team b{font-size:17px}
.team .meta{font-size:13px;color:var(--sub)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);vertical-align:middle;margin-right:4px}
.stage{position:relative;width:100%;aspect-ratio:1400/990;background:#fff;border:1px solid #c9d1dd;border-radius:6px;overflow:hidden;touch-action:none;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage.v3d{background:linear-gradient(#dfeaf7,#f7f9fc);cursor:grab}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1050px){.workspace{grid-template-columns:1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tool{padding:6px 10px}
.tool.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tool.key{border-color:#9fb3d6;background:#eef3fb}
.tool.key.on{background:var(--navy)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aab;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px 8px 0 0;font:inherit;font-weight:700;cursor:pointer;color:var(--sub)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.status{font-size:13px;color:var(--sub);margin-left:auto}
.status.dirty{color:var(--warn);font-weight:700}
.status.saved{color:var(--ok)}
.form label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.form input,.form textarea,.form select{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form textarea{min-height:56px;resize:vertical}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.out{background:#eef2fa;border-radius:8px;padding:8px 10px;font-weight:700;color:var(--navy)}
.out small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.out.bad{background:#fdecea;color:var(--warn)}
.bar{height:8px;background:#dfe4ec;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.bad{background:var(--warn)}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.hint.bad{color:var(--warn);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 6px;text-align:center}
.tbl th{background:#e8edf6}
.tbl input{padding:5px 6px}
.tbl .bad{color:var(--warn);font-weight:700}
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;border-left:6px solid var(--c)}
.layer input[type=range]{width:100%}
table.sum{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;background:#fff}
table.sum th,table.sum td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sum th{background:#e8edf6}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.checks li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:460px;width:100%;max-height:92vh;overflow:auto}
.modal .card.wide{max-width:820px}
.stackgrid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:700px){.stackgrid{grid-template-columns:1fr}}
.segtbl{width:100%;border-collapse:collapse;font-size:13px}
.segtbl th,.segtbl td{border:1px solid var(--line);padding:4px;text-align:center}
.segtbl th{background:#e8edf6}
.modal .segtbl input,.modal .segtbl select{font:inherit;font-size:14px;padding:4px;border:1px solid var(--line);border-radius:6px;width:100%}
.modal .segtbl input[type=color]{height:32px;padding:1px;min-width:40px}
.segsum{margin-top:10px;font-size:14px;line-height:1.7}
.segsum .bad{color:var(--warn);font-weight:700}
.segsum .ok{color:var(--ok);font-weight:700}
.modal .title{font-weight:700;font-size:17px;margin-bottom:8px}
.modal .title.bad{color:var(--warn)}
.modal .msg{white-space:pre-line;line-height:1.65}
.modal label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.modal select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.modal input[type=color]{height:44px;padding:2px 4px}
.modal input{width:100%;font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2533;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
.muted{color:var(--sub);font-size:13px}
.animalgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:700px){.animalgrid{grid-template-columns:repeat(3,1fr)}}
.animal{flex-direction:column;gap:2px;padding:8px 4px}
.animal small{font-size:11px;line-height:1.35;color:#8a6d00;letter-spacing:-0.5px}
.animal.on small{color:#ffe08a}
.animal.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wstage{position:relative;width:100%;height:min(78vh,780px);border-radius:12px;overflow:hidden;background:#bfe0ff;outline:none}
.wstage:fullscreen{height:100vh;border-radius:0}
.wcanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.wload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--navy);background:#dfeaf7;z-index:5}
.wmini{position:absolute;right:10px;top:10px;width:210px;border:2px solid #fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:3;background:#fff}
.winfo{position:absolute;left:10px;top:10px;max-width:340px;background:rgba(255,255,255,.95);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.wplayers{position:absolute;right:10px;top:172px;width:210px;background:rgba(255,255,255,.9);border-radius:8px;padding:6px 10px;font-size:13px;z-index:3;max-height:120px;overflow:auto}
.wchat{position:absolute;left:10px;bottom:34px;width:min(380px,60%);z-index:3}
.wlog{max-height:170px;overflow:auto;background:rgba(0,0,0,.35);color:#fff;border-radius:8px 8px 0 0;padding:6px 10px;font-size:13px;line-height:1.5}
.wlog:empty{display:none}
.wlog b{filter:brightness(1.6)}
.wchat input{width:100%;font:inherit;padding:8px 10px;border:none;border-radius:0 0 8px 8px;background:rgba(255,255,255,.95)}
.wlog:empty + input{border-radius:8px}
.whelp{position:absolute;left:0;right:0;bottom:0;background:rgba(31,56,100,.75);color:#fff;font-size:12px;padding:5px 10px;z-index:3;text-align:center}
.whud{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;pointer-events:none}
.whud-row{display:flex;gap:12px;align-items:center;background:rgba(31,56,100,.85);color:#fff;border-radius:999px;padding:6px 16px;font-size:15px;white-space:nowrap}
.wcoin b{font-size:18px;color:#ffd84d}
.wbar{display:inline-block;width:110px;height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.wbar i{display:block;height:100%;background:#ffd84d}
.wsafe{background:#2e9e5b;border-radius:999px;padding:1px 8px;font-size:13px}
.wwarn{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:4;background:rgba(214,69,69,.92);color:#fff;border-radius:10px;padding:6px 14px;font-size:15px}
.wrank{position:absolute;right:10px;top:300px;width:210px;background:rgba(255,248,220,.95);border-radius:8px;padding:6px 10px;font-size:13px;z-index:3;max-height:220px;overflow:auto;line-height:1.6}
.woverlay,.wshop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,25,50,.45);z-index:6;padding:16px}
.wover-card{background:#fff;border-radius:14px;padding:20px 24px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-height:90%;overflow:auto}
.wcount{font-size:84px;font-weight:700;color:var(--navy);line-height:1}
.wlobby-list{background:#f4f6fa;border-radius:10px;padding:10px;margin-top:8px;line-height:1.7}
.wshop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
@media (max-width:700px){.wshop-grid{grid-template-columns:repeat(2,1fr)}}
.wshop-item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.wshop-item.own{border-color:var(--ok);background:#eefaf1}
.tbg{display:flex;flex-wrap:wrap;gap:8px}
.wsta{width:60px}
.wsta i{background:#7fd3ff}
.wsta i.ex{background:#ff7a7a}
.wstat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left}
@media (max-width:700px){.wstat-grid{grid-template-columns:1fr}}
.wstat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.wstat .btn{align-self:flex-start;min-height:32px;padding:4px 12px}
.wlv{color:#f2a33a;letter-spacing:1px}
.wlvup{color:#d4800a}
.wshop-item .btn{font-size:13px;padding:5px 8px;min-height:32px}
.enh-ok{animation:enhok .8s}
.enh-fail{animation:enhfail .5s}
@keyframes enhok{0%{box-shadow:0 0 0 0 #f2c94c}50%{box-shadow:0 0 0 8px #f2c94c88}100%{box-shadow:none}}
@keyframes enhfail{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tbg .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.v3tools{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3}
.v3tools button{min-height:32px;padding:4px 10px;background:rgba(255,255,255,.92)}
.v3tip{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--sub);z-index:3;background:rgba(255,255,255,.8);padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<header class="top">
  <h1 onclick="location.hash=''">🏙️ 우리 반 도시 만들기</h1>
  <div class="crumb" id="crumb"></div>
</header>
<main id="app"></main>

<script>
/* ============ 기본 설정 ============ */
const W = 1400, H = 990;          // 판 크기(픽셀)
const PX_PER_M = 5;               // 작은 칸 50px = 10m
const FLOOR_M = 3;                // 한 층 높이 3m
const SNAP = 10;                  // 대지·건물은 2m 단위로 맞춤
const BOARD_AREA = (W/PX_PER_M)*(H/PX_PER_M); // 55,440㎡
const TEAMS = [
  {id:'landmark', name:'랜드마크조', color:'#d64545', zone:'상업지 · 경관지구 주변'},
  {id:'housing',  name:'주거조',     color:'#e08a1e', zone:'제1·2·3종 일반주거지역'},
  {id:'green',    name:'녹지조',     color:'#2e9e5b', zone:'자연녹지 · 생산녹지 · 보전녹지'},
  {id:'commerce', name:'상업조',     color:'#2f6fd6', zone:'근린상업 · 일반상업 · 중심상업'},
  {id:'traffic',  name:'교통·도로조', color:'#4a4a4a', zone:'모든 구역을 잇는 도로 · 대중교통'},
];
const TEAM = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const STACK = ['green','traffic','housing','commerce','landmark'];
const CITIES = ['서울','부산','인천(송도)','대구','대전','세종','수원','창원','창녕'];
// 국토계획법 시행령 상한 (건폐율 %, 용적률 %)
const CAPS = {
  '제1종전용주거지역':[50,100],'제2종전용주거지역':[50,150],'제1종일반주거지역':[60,200],'제2종일반주거지역':[60,250],
  '제3종일반주거지역':[50,300],'준주거지역':[70,500],'중심상업지역':[90,1500],'일반상업지역':[80,1300],'근린상업지역':[70,900],
  '유통상업지역':[80,1100],'전용공업지역':[70,300],'일반공업지역':[70,350],'준공업지역':[70,400],'보전녹지지역':[20,80],
  '생산녹지지역':[20,100],'자연녹지지역':[20,100],'계획관리지역':[40,100],'생산관리지역':[20,80],'보전관리지역':[20,80]
};
const TEAM_FIELDS = {
  landmark: [['lmName','랜드마크 이름과 종류 (예: 타워, 다리, 문화회관)'],['lmPlace','위치 (어느 구역 가까이?)'],['lmWhy','이 건물이 우리 도시를 상징하는 이유','area']],
  housing:  [['hType','선택한 주거지역 (몇 종?)'],['hCount','예상 세대 수 / 단독주택 · 아파트 비율'],['hInfra','집 근처 필요한 인프라 (학교 · 공원 …)','area']],
  green:    [['gType','녹지 종류 (공원 / 숲 / 하천 / 농지)'],['gRatio','도시 면적 대비 녹지 비율 목표 (%)'],['gGood','녹지가 도시에 주는 좋은 점 2가지','area'],['gBelt','개발제한구역(그린벨트)이 있나요? 있다면 어디?']],
  commerce: [['cType','상업지역 종류와 이유','area'],['cShops','들어올 가게 · 시설 (시장, 마트, 영화관 …)'],['cWhy','사람들이 모이는 이유 (역세권? 큰길?)']],
  traffic:  [['tNames','우리 도시의 큰 도로(중로 · 대로) 이름'],['tTransit','대중교통 계획 (버스 · 지하철 · 기차역)','area'],['tParking','주차장 위치']],
};
const PALETTE = ['#1d2533','#8a8f99','#d64545','#e08a1e','#e6c229','#2e9e5b','#2f6fd6','#7a4fd0','#8b5a2b','#ffffff'];

/* ============ 작은 도구들 ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clsName = c => `${c[0]}학년 ${c[2]}반`;
const fmtTime = iso => { if(!iso) return ''; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const num = v => { const n=parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:null; };
const r1 = n => Math.round(n*10)/10;
const fmtN = n => n==null?'―':(Math.round(n*10)/10).toLocaleString('ko-KR');
const snap = v => Math.round(v/SNAP)*SNAP;
const rectOf = o => ({x:Math.min(o.a[0],o.b[0]), y:Math.min(o.a[1],o.b[1]), w:Math.abs(o.a[0]-o.b[0]), h:Math.abs(o.a[1]-o.b[1])});
const areaM2 = o => { const r=rectOf(o); return r.w*r.h/(PX_PER_M*PX_PER_M); };
const inside = (inner, outer) => { const a=rectOf(inner), b=rectOf(outer); return a.x>=b.x && a.y>=b.y && a.x+a.w<=b.x+b.w && a.y+a.h<=b.y+b.h; };
const overlaps = (p, q) => { const a=rectOf(p), b=rectOf(q); return a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h; };
const hit = (o, p) => { const r=rectOf(o); return p[0]>=r.x && p[0]<=r.x+r.w && p[1]>=r.y && p[1]<=r.y+r.h; };
const ROADS = [{k:'so',label:'소로',m:8},{k:'jung',label:'중로',m:15},{k:'dae',label:'대로',m:30}];
const roadGrade = m => m>=25?'대로':m>=12?'중로':'소로';
function segPtDist(p, a, b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy); }
function segsCross(a,b,c,d){ const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0])); return o(a,b,c)!==o(a,b,d) && o(c,d,a)!==o(c,d,b); }
function rectSegDist(o, a, b){ // 사각형과 선분 사이 거리(px)
  const r=rectOf(o); const inR=p=>p[0]>=r.x&&p[0]<=r.x+r.w&&p[1]>=r.y&&p[1]<=r.y+r.h;
  if(inR(a)||inR(b)) return 0;
  const cs=[[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]];
  for(let i=0;i<4;i++) if(segsCross(a,b,cs[i],cs[(i+1)%4])) return 0;
  return Math.min(...cs.map(c=>segPtDist(c,a,b)), ...[a,b].map(p=>Math.hypot(Math.max(r.x-p[0],0,p[0]-r.x-r.w), Math.max(r.y-p[1],0,p[1]-r.y-r.h))));
}
const onRoad = (o, rd) => rectSegDist(o, rd.a, rd.b) < rd.m*PX_PER_M/2 - 0.5;          // 건물이 도로 위에 있음
const touchRoad = (o, rd) => rectSegDist(o, rd.a, rd.b) <= rd.m*PX_PER_M/2 + 2*PX_PER_M; // 대지가 도로에 닿음(2m 이내)
const roadGap = (o, rd) => (rectSegDist(o, rd.a, rd.b) - rd.m*PX_PER_M/2)/PX_PER_M; // 도로 경계까지 거리(m)
const SHAPES = [['box','상자'],['cyl','원기둥'],['tier','계단탑'],['pyr','피라미드'],['dome','돔'],['spire','첨탑']];
const SHAPE_NAME = Object.fromEntries(SHAPES);
const SEG_SHAPES = [['box','상자'],['cyl','원기둥'],['pyr','피라미드 (꼭대기만)'],['dome','돔 (꼭대기만)'],['spire','첨탑 (꼭대기만)']];
const SEG_SCALES = [[1,'100%'],[0.85,'85%'],[0.7,'70%'],[0.55,'55%'],[0.4,'40%'],[0.25,'25%']];
const TOP_ONLY = ['pyr','dome','spire'];
const segArea = (b, sg) => { const a=areaM2(b)*sg.scale*sg.scale; return (sg.shape==='cyl'||sg.shape==='dome')? a*Math.PI/4 : a; };
const bArea = b => { if(b.segs&&b.segs.length) return segArea(b,b.segs[0]); const a=areaM2(b); return (b.shape==='cyl'||b.shape==='dome')? a*Math.PI/4 : a; };
const bGFA = b => b.segs&&b.segs.length ? b.segs.reduce((t,sg)=>t+segArea(b,sg)*sg.floors,0) : bArea(b)*(b.floors||1);
const bHeight = b => { const r=rectOf(b);
  if(b.segs&&b.segs.length){ const base=b.segs.reduce((t,sg)=>t+sg.floors,0)*FLOOR_M, top=b.segs[b.segs.length-1];
    if(top.shape==='dome') return r1(base+Math.min(r.w,r.h)*top.scale/PX_PER_M/2);
    if(top.shape==='spire') return r1(base+top.floors*FLOOR_M*0.4);
    return r1(base); }
  const base=(b.floors||1)*FLOOR_M; if(b.shape==='dome') return r1(base+Math.min(r.w,r.h)/PX_PER_M/2); if(b.shape==='spire') return r1(base*1.4); return base; };
const isSpecial = f => f?.special==='yes' && String(f?.specialWhy||'').trim().length>=10;   // 특별건축구역(심의 통과)
const isSuperTall = b => (b.floors||0)>=50 || bHeight(b)>=200;                                  // 초고층(50층 이상 또는 200m 이상)
const GKINDS = {park:{label:'공원',fill:'#a8dc9f',edge:'#2e9e5b'}, forest:{label:'숲',fill:'#5fa868',edge:'#2b6e33'}, river:{label:'하천',fill:'#93cdf0',edge:'#3a86c8'}, farm:{label:'농지',fill:'#dfe8a3',edge:'#9aa83a'}};
const uid = () => Math.random().toString(36).slice(2,9);
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
// 모달: buttons [[label, value, class]], inputs [{k,label,type,value,placeholder}]
function dialog({title='', msg='', bad=false, inputs=[], buttons=[['확인',true,'primary']]}){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="card">${title?`<div class="title${bad?' bad':''}">${esc(title)}</div>`:''}<div class="msg">${esc(msg)}</div>
      ${inputs.map(i=>`<label>${esc(i.label)}</label>${i.type==='select'?`<select data-k="${i.k}">${i.options.map(([v,l])=>`<option value="${esc(v)}" ${v===i.value?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input data-k="${i.k}" type="${i.type||'text'}" ${i.type==='number'?'inputmode="numeric" min="1"':''} value="${esc(i.value??'')}" placeholder="${esc(i.placeholder||'')}">`}`).join('')}
      <div class="acts"></div></div>`;
    const vals=()=>Object.fromEntries([...m.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value]));
    buttons.forEach(([label,val,cls])=>{ const b=document.createElement('button'); b.className='btn '+(cls||''); b.textContent=label; b.onclick=()=>{m.remove();res({btn:val, values:vals()})}; $('.acts',m).appendChild(b); });
    m.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const p=buttons.find(b=>b[2]==='primary'); if(p){ m.remove(); res({btn:p[1], values:vals()}); } } });
    document.body.appendChild(m);
    const f=m.querySelector('input'); if(f){ f.focus(); f.select(); }
  });
}
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
};

/* ============ API (서버, 없으면 이 기기 저장) ============ */
let OFFLINE = false;
async function apiGet(cls, team){
  if(!OFFLINE){
    try{
      const r = await fetch(`/api/data?cls=${cls}${team?'&team='+team:''}`, {cache:'no-store'});
      if(r.ok && (r.headers.get('content-type')||'').includes('json')) return await r.json();
      throw new Error('no api');
    }catch(e){ OFFLINE = true; }
  }
  if(team) return ls.get(`cp:${cls}/${team}`);
  const out={meta:ls.get(`cp:${cls}/meta`), teams:{}};
  TEAMS.forEach(t=>out.teams[t.id]=ls.get(`cp:${cls}/${t.id}`));
  return out;
}
async function apiPut(cls, team, body){
  if(!OFFLINE){
    try{
      const r = await fetch(`/api/data?cls=${cls}&team=${team}`, {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
      const j = await r.json();
      if(r.status===409) return {conflict:true, current:j.current};
      if(!r.ok) throw new Error(j.error||r.status);
      return j;
    }catch(e){ return {error:String(e.message||e)}; }
  }
  const key=`cp:${cls}/${team}`, cur=ls.get(key), v=cur?.version??0;
  if(!body.force && (body.baseVersion??0)!==v) return {conflict:true, current:cur};
  const rec={data:body.data, version:v+1, savedAt:new Date().toISOString(), savedBy:body.savedBy||''};
  ls.set(key, rec); return {ok:true, version:rec.version, savedAt:rec.savedAt};
}

// 조 하나의 대지·건물을 상한과 비교
function evalTeam(fields, data, roads=[]){
  const f=fields||{}, sites=data?.sites||[], bldgs=data?.bldgs||[];
  const capB=num(f.bcr), capF=num(f.far);
  const per = sites.map((s,i)=>({i:i+1, id:s.id, area:areaM2(s), foot:0, gfa:0, n:0}));
  const orphan=[];
  bldgs.forEach(b=>{ const k=sites.findIndex(s=>inside(b,s)); const fa=bArea(b);
    if(k<0){ orphan.push(b); return; } per[k].foot+=fa; per[k].gfa+=bGFA(b); per[k].n++; });
  per.forEach(p=>{ p.bcr=p.area?p.foot/p.area*100:0; p.far=p.area?p.gfa/p.area*100:0;
    p.overB = capB!=null && p.bcr > capB+1e-9; p.overF = capF!=null && p.far > capF+1e-9; });
  const siteArea=per.reduce((a,p)=>a+p.area,0), foot=per.reduce((a,p)=>a+p.foot,0), gfa=per.reduce((a,p)=>a+p.gfa,0);
  const maxFloors=bldgs.reduce((m,b)=>Math.max(m,b.floors||0),0);
  const maxH=bldgs.reduce((m,b)=>Math.max(m,bHeight(b)),0);
  const issues=[];
  per.forEach(p=>{ if(p.overB) issues.push(`대지${p.i} 건폐율 ${r1(p.bcr)}% > 상한 ${capB}%`); if(p.overF) issues.push(`대지${p.i} 용적률 ${r1(p.far)}% > 상한 ${capF}%`); });
  if(orphan.length) issues.push(`대지 밖 건물 ${orphan.length}개`);
  const hl=isSpecial(f)?null:num(f.hLimit); if(hl!=null && maxH>hl) issues.push(`높이 ${maxH}m > 고도 제한 ${hl}m`);
  const sb=isSpecial(f)?0:num(f.setback); if(sb!=null && sb>0 && roads.length){ const near=bldgs.filter(b=>roads.some(rd=>roadGap(b,rd) < sb-0.05)); if(near.length) issues.push(`도로에서 ${sb}m 안 띄운 건물 ${near.length}채`); }
  return {capB, capF, per, siteArea, foot, gfa, maxFloors, maxH, bcrNow: siteArea?foot/siteArea*100:0, farNow: siteArea?gfa/siteArea*100:0, issues, nB:bldgs.length};
}
function nationalCap(f){ return CAPS[(f?.zone||'').replace(/\s/g,'')]; }

/* ============ 평면 그리기 ============ */
function drawBg(ctx){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#eef1f5'; ctx.lineWidth=1;
  for(let x=50;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=50;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='#dde2ea';
  for(let x=250;x<W;x+=250){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=250;y<H;y+=250){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='#888'; ctx.lineWidth=3;
  [[30,30],[W-30,30],[30,H-30],[W-30,H-30]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+14,y);ctx.moveTo(x,y-14);ctx.lineTo(x,y+14);ctx.stroke();});
  ctx.fillStyle='#9aa3b2'; ctx.font="13px 'Noto Sans KR', sans-serif"; ctx.fillText('작은 칸 1칸 = 10m × 10m (100㎡)', 56, H-24);
}
function drawStroke(ctx, s){
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=s.w||4;
  if(s.t==='eraser'){ ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='#000'; ctx.fillStyle='#000'; }
  else { ctx.strokeStyle=s.c; ctx.fillStyle=s.c; }
  if(s.t==='pen'||s.t==='eraser'){
    const p=s.p; if(!p||p.length<2){ctx.restore();return;}
    if(p.length===2){ ctx.beginPath(); ctx.arc(p[0],p[1],ctx.lineWidth/2,0,Math.PI*2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]); ctx.stroke(); }
  } else if(s.t==='line'){
    ctx.beginPath(); ctx.moveTo(s.a[0],s.a[1]); ctx.lineTo(s.b[0],s.b[1]); ctx.stroke();
  } else if(s.t==='rect'||s.t==='fill'){
    const r=rectOf(s);
    if(s.t==='fill'){ ctx.globalAlpha=.35; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1; }
    ctx.strokeRect(r.x,r.y,r.w,r.h);
  } else if(s.t==='text'){
    ctx.font=`700 ${s.size||28}px 'Noto Sans KR', sans-serif`; ctx.textBaseline='middle';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.strokeText(s.text,s.a[0],s.a[1]);
    ctx.fillText(s.text,s.a[0],s.a[1]);
  }
  ctx.restore();
}
function drawSite(ctx, s, i, color){
  const r=rectOf(s);
  ctx.save(); ctx.globalAlpha=.07; ctx.fillStyle=color; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1;
  ctx.setLineDash([12,8]); ctx.lineWidth=3; ctx.strokeStyle=color; ctx.strokeRect(r.x,r.y,r.w,r.h); ctx.setLineDash([]);
  ctx.font="700 15px 'Noto Sans KR', sans-serif"; ctx.fillStyle=color; ctx.textBaseline='top';
  ctx.fillText(`대지${i+1} · ${fmtN(areaM2(s))}㎡`, r.x+6, r.y+5);
  ctx.restore();
}
function drawBldg(ctx, b, color){
  const r=rectOf(b), col=b.color||color, round=b.shape==='cyl'||b.shape==='dome';
  const path=()=>{ ctx.beginPath(); if(round) ctx.ellipse(r.x+r.w/2,r.y+r.h/2,r.w/2,r.h/2,0,0,Math.PI*2); else ctx.rect(r.x,r.y,r.w,r.h); };
  ctx.save(); ctx.globalAlpha=.62; ctx.fillStyle=col; path(); ctx.fill(); ctx.globalAlpha=1;
  ctx.lineWidth=2.5; ctx.strokeStyle=shade(col,-.35); path(); ctx.stroke();
  ctx.lineWidth=1.2;
  if(b.shape==='pyr'||b.shape==='spire'){ ctx.beginPath(); ctx.moveTo(r.x,r.y); ctx.lineTo(r.x+r.w,r.y+r.h); ctx.moveTo(r.x+r.w,r.y); ctx.lineTo(r.x,r.y+r.h); ctx.stroke(); }
  if(b.shape==='tier') [0.72,0.48].forEach(k=>ctx.strokeRect(r.x+r.w*(1-k)/2, r.y+r.h*(1-k)/2, r.w*k, r.h*k));
  if(b.shape==='dome'){ ctx.beginPath(); ctx.ellipse(r.x+r.w/2,r.y+r.h/2,r.w/4,r.h/4,0,0,Math.PI*2); ctx.stroke(); }
  if(b.segs) b.segs.slice(1).forEach(sg=>{ const w=r.w*sg.scale, h=r.h*sg.scale; ctx.strokeStyle=shade(sg.color||col,-.35); ctx.beginPath();
    if(sg.shape==='cyl'||sg.shape==='dome') ctx.ellipse(r.x+r.w/2,r.y+r.h/2,w/2,h/2,0,0,Math.PI*2); else ctx.rect(r.x+(r.w-w)/2, r.y+(r.h-h)/2, w, h); ctx.stroke(); });
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  const fs=Math.max(11,Math.min(20,r.w/4,r.h/2.2)); const sub=b.name || (b.segs?`층 쌓기 ${b.segs.length}단`:b.shape&&b.shape!=='box'?SHAPE_NAME[b.shape]:'');
  const txt=(t,y,size,wt)=>{ ctx.font=`${wt} ${size}px 'Noto Sans KR', sans-serif`; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.strokeText(t,r.x+r.w/2,y); ctx.fillStyle='#fff'; ctx.fillText(t,r.x+r.w/2,y); };
  txt(`${b.floors}층`, r.y+r.h/2-(sub?fs*.55:0), fs, 700);
  if(sub) txt(sub.slice(0,10), r.y+r.h/2+fs*.6, Math.max(10,fs*.75), 500);
  if(isSuperTall(b)){ ctx.font="700 12px 'Noto Sans KR', sans-serif"; const tw=ctx.measureText('초고층').width+8; ctx.fillStyle='#f2c94c'; ctx.fillRect(r.x+2,r.y+2,tw,17); ctx.fillStyle='#1d2533'; ctx.textAlign='left'; ctx.fillText('초고층', r.x+6, r.y+11); }
  ctx.restore();
}
function autoTrees(g){ // 숲·공원 안 나무 (항상 같은 자리)
  const r=rectOf(g), sp=g.kind==='forest'?42:95, out=[];
  if(g.kind!=='forest'&&g.kind!=='park') return out;
  let seed=((Math.round(r.x)*73856093) ^ (Math.round(r.y)*19349663))>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  for(let y=r.y+sp/2; y<r.y+r.h-6; y+=sp) for(let x=r.x+sp/2; x<r.x+r.w-6; x+=sp){
    const tx=Math.min(r.x+r.w-8,Math.max(r.x+8,x+(rnd()-.5)*sp*.6)), ty=Math.min(r.y+r.h-8,Math.max(r.y+8,y+(rnd()-.5)*sp*.6));
    out.push({x:tx, y:ty, s:(g.kind==='forest'?36:32)*(0.8+rnd()*0.5), kind: g.kind==='forest'&&rnd()<.5?'pine':'round'});
    if(out.length>600) return out;
  }
  return out;
}
function drawGreen(ctx, g, dots=true){
  const r=rectOf(g), k=GKINDS[g.kind]||GKINDS.park;
  ctx.save(); ctx.fillStyle=k.fill; ctx.globalAlpha=.92; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
  if(g.kind==='farm'){ ctx.strokeStyle='rgba(120,140,40,.45)'; ctx.lineWidth=2; for(let x=r.x+8;x<r.x+r.w;x+=14){ ctx.beginPath(); ctx.moveTo(x,r.y); ctx.lineTo(x,r.y+r.h); ctx.stroke(); } }
  if(g.kind==='river'){ ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=2; for(let y=r.y+14;y<r.y+r.h;y+=22){ ctx.beginPath(); for(let x=r.x;x<=r.x+r.w;x+=8) ctx.lineTo(x, y+Math.sin(x/14)*4); ctx.stroke(); } }
  if(dots){ ctx.fillStyle=g.kind==='forest'?'rgba(30,90,40,.6)':'rgba(46,130,70,.55)'; autoTrees(g).forEach(t=>{ ctx.beginPath(); ctx.arc(t.x,t.y,t.s/4,0,Math.PI*2); ctx.fill(); }); }
  ctx.restore();
  ctx.save(); ctx.strokeStyle=k.edge; ctx.lineWidth=2.5; ctx.strokeRect(r.x,r.y,r.w,r.h);
  ctx.font="700 15px 'Noto Sans KR', sans-serif"; ctx.textBaseline='top';
  const t=`${g.name||k.label} · ${fmtN(areaM2(g))}㎡`, tw=ctx.measureText(t).width+8;
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(r.x+4,r.y+4,tw,21); ctx.fillStyle='#1d2533'; ctx.fillText(t, r.x+8, r.y+6);
  ctx.restore();
}
function drawTree2D(ctx,t){ ctx.save(); ctx.fillStyle=t.kind==='pine'?'#2b6e33':'#3f9a4d'; ctx.strokeStyle='#1f5a2a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(t.p[0],t.p[1],(t.s||40)/4,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); }
function drawRoad(ctx, rd, label=true){
  const w=rd.m*PX_PER_M;
  ctx.save(); ctx.lineCap='square'; ctx.strokeStyle='#6b7079'; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(rd.a[0],rd.a[1]); ctx.lineTo(rd.b[0],rd.b[1]); ctx.stroke();
  ctx.lineCap='butt'; ctx.strokeStyle=rd.m>=12?'#f2c94c':'#ffffff'; ctx.lineWidth=rd.m>=25?4:2.5; ctx.setLineDash([18,14]);
  ctx.beginPath(); ctx.moveTo(rd.a[0],rd.a[1]); ctx.lineTo(rd.b[0],rd.b[1]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  if(label) drawRoadLabel(ctx, rd);
}
function drawRoadLabel(ctx, rd){
  const w=rd.m*PX_PER_M; ctx.save();
  {
    const mx=rd.a[0]+(rd.b[0]-rd.a[0])*.22, my=rd.a[1]+(rd.b[1]-rd.a[1])*.22; let ang=Math.atan2(rd.b[1]-rd.a[1], rd.b[0]-rd.a[0]); if(ang>Math.PI/2||ang<-Math.PI/2) ang+=Math.PI;
    ctx.translate(mx,my); ctx.rotate(ang); ctx.font=`700 ${Math.max(12,Math.min(18,w*.45))}px 'Noto Sans KR', sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    const t=`${rd.name?rd.name+' · ':''}${roadGrade(rd.m)} ${rd.m}m`; const tw=ctx.measureText(t).width+12;
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillRect(-tw/2, -11, tw, 22); ctx.fillStyle='#1d2533'; ctx.fillText(t,0,1);
  }
  ctx.restore();
}
// data: {strokes, roads, sites, bldgs}
function drawLayer(ctx, data, color, {bldgs=true}={}){
  ctx.clearRect(0,0,W,H);
  (data?.strokes||[]).forEach(s=>drawStroke(ctx,s));
  (data?.greens||[]).forEach(g=>drawGreen(ctx,g,bldgs));
  (data?.roads||[]).forEach(r=>drawRoad(ctx,r,false));
  (data?.roads||[]).forEach(r=>drawRoadLabel(ctx,r));
  (data?.sites||[]).forEach((s,i)=>drawSite(ctx,s,i,color));
  if(bldgs) (data?.trees||[]).forEach(t=>drawTree2D(ctx,t));
  if(bldgs) (data?.bldgs||[]).forEach(b=>drawBldg(ctx,b,color));
}

  const p0=(X,Y,Z)=>{ const [a,b]=rot(X,Y); return [(a-b)*C30, (a+b)*0.5 - Z]; };
  let maxZ=0; layers.forEach(l=>(l.bldgs||[]).forEach(b=>maxZ=Math.max(maxZ,bHeight(b)*PX_PER_M)));

function make3DView(stage, getLayers){
  stage.classList.add('v3d');
  const cv=mkCanvas(W,H); stage.appendChild(cv);
  const view={angle:0, zoom:1, panX:0, panY:0};
  stage.insertAdjacentHTML('beforeend',`<div class="v3tools"><button class="btn" data-v="l">⟲</button><button class="btn" data-v="r">⟳</button><button class="btn" data-v="in">＋</button><button class="btn" data-v="out">－</button><button class="btn" data-v="0">처음</button></div><div class="v3tip">드래그: 돌리기 · Shift+드래그: 옮기기 · 휠: 확대</div>`);
  const draw=()=>render3D(cv, getLayers(), view);
  stage.querySelectorAll('[data-v]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const v=b.dataset.v;
    if(v==='l') view.angle-=45; if(v==='r') view.angle+=45; if(v==='in') view.zoom*=1.2; if(v==='out') view.zoom/=1.2; if(v==='0'){view.angle=0;view.zoom=1;view.panX=0;view.panY=0;} draw(); });
  let drag=null;
  cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2}; cv.setPointerCapture(e.pointerId); stage.style.cursor='grabbing'; });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const r=cv.getBoundingClientRect(), sc=W/r.width; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.pan){ view.panX+=dx*sc; view.panY+=dy*sc; } else view.angle+=dx*0.4; draw(); });
  const up=()=>{ drag=null; stage.style.cursor=''; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); view.zoom*=e.deltaY<0?1.1:1/1.1; draw(); },{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  draw();
  return {draw};
}

  /* --- 건물 규칙 검사 --- */
  function checkBldg(cand, ignoreId){
    const f=st.fields, capB=num(f.bcr), capF=num(f.far);
    if(capB==null||capF==null) return {err:'먼저 오른쪽 칸에 ③ 건폐율 상한과 ④ 용적률 상한을 입력해요.\n(3단계에서 조례로 찾은 숫자예요)'};
    const nc=nationalCap(f);
    if(nc && (capB>nc[0]||capF>nc[1])) return {err:`입력한 상한(건폐율 ${capB}% · 용적률 ${capF}%)이 국가 상한(${nc[0]}% · ${nc[1]}%)보다 커요.\n조례 숫자를 다시 확인해요.`};
    if(f.special==='yes' && !isSpecial(f)) return {err:'특별건축구역 심의 중이에요.\n오른쪽에 "이 랜드마크가 특별한 이유"를 10자 이상 써야 심의를 통과하고 건물을 지을 수 있어요.\n(신청하지 않으려면 "아니오"로 바꿔요)'};
    const sbv=isSpecial(f)?'0':String(f.setback??'').trim();
    if(sbv==='') return {err:'먼저 오른쪽 칸에 "도로에서 띄울 거리 (m)"를 입력해요.\n(건축조례의 대지 안의 공지 숫자, 없으면 0)'};
    const si=st.sites.findIndex(s=>inside(cand,s));
    if(si<0) return {err:'건물은 점선으로 그린 대지 안에 지어야 해요.\n대지 밖으로 나가지 않게 다시 그려요.'};
    const rd=allRoads().find(r=>onRoad(cand,r));
    if(rd) return {err:`도로(${rd.name?rd.name+' · ':''}${roadGrade(rd.m)} ${rd.m}m) 위에는 건물을 지을 수 없어요.\n도로 밖 빈 곳에 그려요.`};
    const sb=num(sbv)||0;
    if(sb>0){ const near=allRoads().map(r=>({r,g:roadGap(cand,r)})).filter(x=>x.g<sb-0.05).sort((a,b)=>a.g-b.g)[0];
      if(near) return {err:`도로에서 너무 가까워요!\n${near.r.name||roadGrade(near.r.m)} 경계에서 ${r1(Math.max(0,near.g))}m 떨어져 있어요.\n조례 기준은 ${sb}m 이상이에요. (빨간 띠 밖에 지어요)`, fatal:true}; }
    const ob=otherBldgs().find(x=>overlaps(x.b,cand));
    if(ob) return {err:`${ob.t.name}의 건물과 겹쳐요. 빈 곳에 그려요.`};
    const rest=st.bldgs.filter(b=>b.id!==ignoreId);
    if(rest.some(b=>overlaps(b,cand))) return {err:'다른 건물과 겹쳐요. 빈 곳에 그려요.'};
    const site=st.sites[si], sArea=areaM2(site), fa=areaM2(cand);
    const inSite=rest.filter(b=>inside(b,site));
    const foot=inSite.reduce((a,b)=>a+bArea(b),0)+fa, gfaOther=inSite.reduce((a,b)=>a+bGFA(b),0);
    const bcr=foot/sArea*100;
    if(bcr>capB+1e-9) return {err:`건폐율 초과!\n대지${si+1} 면적 ${fmtN(sArea)}㎡ 중 건물 바닥이 ${fmtN(foot)}㎡가 되어\n건폐율이 ${r1(bcr)}%예요. (상한 ${capB}%)\n\n건물 바닥을 더 작게 그려요. 이 대지에 남은 바닥 면적은 ${fmtN(Math.max(0,sArea*capB/100-(foot-fa)))}㎡예요.`, fatal:true};
    const maxByFar=Math.floor((sArea*capF/100-gfaOther)/fa+1e-9);
    const hl=tid==='landmark'&&!isSpecial(f)?num(f.hLimit):null, maxByH=hl!=null?Math.floor(hl/FLOOR_M):Infinity;
    return {si, sArea, fa, gfaOther, maxF:Math.min(maxByFar,maxByH), maxByFar, maxByH, capF, hl};
  }
  async function askFloors(cand, info, current){
    const lm=tid==='landmark';
    let val=current||1, shape=cand.shape||'box', color=cand.color||T.color, name=cand.name||'';
    while(true){
      const inputs=[{k:'floors',label:'층수',type:'number',value:val},{k:'name',label:'건물 이름 (선택, 예: 우리 집, 시청)',value:name}];
      if(lm) inputs.push({k:'shape',label:'모양',type:'select',value:shape,options:SHAPES},{k:'color',label:'색',type:'color',value:color});
      const r=await dialog({title: lm?'🏛️ 랜드마크 짓기':'🏢 몇 층으로 지을까요?',
        msg:`바닥 ${fmtN(info.fa)}㎡ · 대지${info.si+1}\n이 자리에 지을 수 있는 최대 층수(상자 모양): ${info.maxF>=1?info.maxF+'층':'없음'}${lm?'\n원기둥·돔은 바닥이 둥글어 면적이 작아지고, 돔·첨탑은 지붕만큼 더 높아져요.':''}`,
        inputs, buttons:[['취소',null],['짓기','ok','primary']]});
      if(r.btn!=='ok') return null;
      const fl=Math.floor(num(r.values.floors)||0); name=(r.values.name||'').trim().slice(0,12);
      if(lm){ shape=r.values.shape||'box'; color=r.values.color||T.color; }
      if(fl<1){ await dialog({title:'층수를 확인해요', bad:true, msg:'1층 이상으로 입력해요.'}); val=1; continue; }
      const test={...cand, floors:fl, shape: lm?shape:undefined};
      const fa=bArea(test), gfa=info.gfaOther+fa*fl, far=gfa/info.sArea*100;
      const maxByFar=Math.floor((info.sArea*info.capF/100-info.gfaOther)/fa+1e-9);
      if(far>info.capF+1e-9){
        await dialog({title:'⚠️ 용적률 초과! 지을 수 없어요', bad:true, msg:`${fl}층이면 연면적 ${fmtN(gfa)}㎡ → 용적률 ${r1(far)}%예요. (상한 ${info.capF}%)\n\n${maxByFar>=1?`이 자리에는 ${maxByFar}층까지 지을 수 있어요.`:'이 대지는 용적률이 꽉 찼어요. 다른 건물 층수를 줄이거나 바닥을 작게 그려요.'}`});
        if(maxByFar<1) return null; val=maxByFar; continue;
      }
      const hgt=bHeight(test);
      if(info.hl!=null && hgt>info.hl){
        let ok=fl; while(ok>0 && bHeight({...test,floors:ok})>info.hl) ok--;
        await dialog({title:'⚠️ 높이 제한 초과! 지을 수 없어요', bad:true, msg:`${fl}층${lm&&shape!=='box'?' '+SHAPE_NAME[shape]:''}이면 높이 약 ${hgt}m예요. 고도지구 제한은 ${info.hl}m라서\n${ok>=1?`이 모양으로는 ${ok}층까지 지을 수 있어요.`:'이 모양으로는 지을 수 없어요.'}`});
        val=Math.max(1,ok); continue;
      }
      const out={floors:fl, name}; if(lm){ out.shape=shape; out.color=color; } return out;
    }
  }
  /* --- 랜드마크 층 쌓기 --- */

        body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ segs.splice(+b.dataset.del,1); draw(); });
        refresh();
      }
      function refresh(){
        const c=check(), sum=$('#segSum',m), tf=c.test.floors;
        sum.innerHTML=`총 <b>${tf}층</b> · 높이 <b>${c.hgt}m</b> · 연면적 <b>${fmtN(c.gfa-info.gfaOther)}㎡</b> · 대지 용적률 <b>${r1(c.far)}%</b> / ${info.capF}%${(tf>=50||c.hgt>=200)?' · 🏙️ 초고층':''}<br>`+
          (c.probs.length? c.probs.map(t=>`<span class="bad">⚠️ ${esc(t)}</span>`).join('<br>') : '<span class="ok">✅ 규칙을 모두 지켰어요. 지을 수 있어요!</span>');

        close({segs:segs.map(sg=>({...sg})), floors:c.test.floors, name:(name||'').trim().slice(0,12), shape:segs[0].shape==='cyl'?'cyl':'box', color:segs[0].color}); };

    });
  }
  async function superTallNotice(b){
    const n=b.floors, refuge=Math.floor((n-1)/30);
    await dialog({title:'🏙️ 초고층 건축물이에요!', msg:`${n}층 · 높이 약 ${bHeight(b)}m → 50층 이상 또는 200m 이상이라 초고층이에요.\n\n「초고층 및 지하연계 복합건축물 재난관리에 관한 특별법」에 따라\n• 짓기 전 사전재난영향성평가를 받아야 해요\n• 피난안전구역을 최대 30개 층마다 만들어요 (이 건물은 ${Math.max(1,refuge)}곳 이상)\n• 총괄재난관리자와 종합방재실을 둬야 해요\n\n입체 보기에서 노란 띠가 피난안전구역이에요.`});
  }
  async function addBldg(cand){
    const info=checkBldg(cand);
    if(info.err){ await dialog({title:'⚠️ 지을 수 없어요', bad:true, msg:info.err}); return; }
    if(info.maxF<1){ await dialog({title:'⚠️ 지을 수 없어요', bad:true, msg:info.maxByFar<1?'이 대지는 용적률이 꽉 찼어요.\n다른 건물 층수를 줄이거나 바닥을 작게 그려요.':'높이 제한 때문에 1층도 지을 수 없어요.'}); return; }
    let r;
    if(tid==='landmark'){
      const how=await dialog({title:'🏛️ 어떻게 지을까요?', msg:'한 가지 모양으로 지을 수도 있고,\n구간마다 층수·모양·크기·색을 다르게 해서 층을 쌓을 수도 있어요.', buttons:[['취소',null],['한 모양으로','one'],['층 쌓기로','stack','primary']]});
      if(!how.btn) return;
      r = how.btn==='stack' ? await stackEditor(cand, info) : await askFloors(cand, info, 1);
    } else r=await askFloors(cand, info, 1);
    if(!r) return;
    const nb={...cand, id:uid(), ...r};
    commit(()=>st.bldgs.push(nb));
    if(isSuperTall(nb)) await superTallNotice(nb);
    toast(`${r.floors}층 건물을 지었어요!`);
  }
  async function editAt(p){
    const b=[...st.bldgs].reverse().find(b=>hit(b,p));
    if(b){
      const info=checkBldg(b, b.id);
      if(info.err && !info.fatal){ await dialog({title:'⚠️ 확인해요', bad:true, msg:info.err}); }
      const btns=[['닫기',null],['삭제','del','danger']];
      if(tid==='landmark'){ if(!b.segs) btns.push(['한 모양 고치기','edit']); btns.push([b.segs?'층 쌓기 고치기':'층 쌓기로 바꾸기','stack','primary']); }
      else btns.push(['층수·이름 바꾸기','edit','primary']);
      const r=await dialog({title:`🏢 ${b.name||'건물'} · ${b.floors}층${b.segs?` · 층 쌓기 ${b.segs.length}단`:b.shape&&b.shape!=='box'?' · '+SHAPE_NAME[b.shape]:''}`, msg:`바닥 넓이 ${fmtN(bArea(b))}㎡ · 연면적 ${fmtN(bGFA(b))}㎡ · 높이 약 ${bHeight(b)}m`, buttons:btns});
      if(r.btn==='stack'){
        if(info.err){ await dialog({title:'⚠️ 바꿀 수 없어요', bad:true, msg:info.err+'\n\n건물을 지우고 다시 지어요.'}); return; }
        const n=await stackEditor(b, info); if(!n) return;
        commit(()=>{ const x=st.bldgs.find(x=>x.id===b.id); Object.assign(x, n); });
        const x2=st.bldgs.find(x=>x.id===b.id); if(x2&&isSuperTall(x2)) await superTallNotice(x2);
        return;
      }
      if(r.btn==='del') commit(()=>{ st.bldgs=st.bldgs.filter(x=>x.id!==b.id); });
      if(r.btn==='edit'){
        if(info.err){ await dialog({title:'⚠️ 바꿀 수 없어요', bad:true, msg:info.err+'\n\n건물을 지우고 다시 지어요.'}); return; }
        const n=await askFloors(b, info, b.floors); if(!n) return;
        commit(()=>{ const x=st.bldgs.find(x=>x.id===b.id); Object.assign(x, n); delete x.segs; });
        const x2=st.bldgs.find(x=>x.id===b.id); if(x2&&isSuperTall(x2)) await superTallNotice(x2);
      }
      return;
    }
    const rd=[...st.roads].reverse().find(r=>segPtDist(p,r.a,r.b)<=r.m*PX_PER_M/2+4);
    if(rd){
      const r=await dialog({title:`🛣️ ${rd.name||'도로'} · ${roadGrade(rd.m)} ${rd.m}m`, msg:`길이 ${fmtN(Math.hypot(rd.b[0]-rd.a[0],rd.b[1]-rd.a[1])/PX_PER_M)}m`, inputs:[{k:'name',label:'도로 이름',value:rd.name||''}], buttons:[['닫기',null],['도로 삭제','del','danger'],['이름 바꾸기','edit','primary']]});
      if(r.btn==='del') commit(()=>{ st.roads=st.roads.filter(x=>x!==rd); });
      if(r.btn==='edit') commit(()=>{ rd.name=(r.values.name||'').trim().slice(0,12); });
      return;
    }
    const tr=st.trees.findIndex(t=>Math.hypot(t.p[0]-p[0],t.p[1]-p[1])<=(t.s||40)/4+4);
    if(tr>=0){ commit(()=>st.trees.splice(tr,1)); toast('나무를 뽑았어요'); return; }
    const gi=[...st.greens].reverse().find(g=>hit(g,p));
    if(gi){ const kk=GKINDS[gi.kind]||GKINDS.park;
      const r=await dialog({title:`🌳 ${gi.name||kk.label} · ${fmtN(areaM2(gi))}㎡`, inputs:[{k:'kind',label:'종류',type:'select',value:gi.kind,options:Object.entries(GKINDS).map(([k,v])=>[k,v.label])},{k:'name',label:'이름 (선택, 예: 중앙공원)',value:gi.name||''}], buttons:[['닫기',null],['삭제','del','danger'],['바꾸기','edit','primary']]});
      if(r.btn==='del') commit(()=>{ st.greens=st.greens.filter(x=>x!==gi); });
      if(r.btn==='edit') commit(()=>{ gi.kind=r.values.kind||gi.kind; gi.name=(r.values.name||'').trim().slice(0,12); });
      return; }
    const si=st.sites.findIndex(s=>hit(s,p));
    if(si>=0){
      const s=st.sites[si], cnt=st.bldgs.filter(b=>inside(b,s)).length;
      const r=await dialog({title:`대지${si+1} · ${fmtN(areaM2(s))}㎡`, msg: cnt?`이 대지에 건물 ${cnt}채가 있어요. 대지를 지우면 건물도 함께 지워져요.`:'빈 대지예요.', buttons:[['닫기',null],['대지 삭제','del','danger']]});
      if(r.btn==='del') commit(()=>{ st.bldgs=st.bldgs.filter(b=>!inside(b,s)); st.sites=st.sites.filter(x=>x.id!==s.id); });
      return;
    }
    toast(tid==='traffic'?'도로나 건물, 대지를 눌러요':tid==='green'?'녹지 구역이나 나무를 눌러요':'건물이나 대지를 눌러요');
  }

  /* --- 마우스 · 터치 --- */
  let cur=null;
  const pt=e=>{ const r=cTmp.getBoundingClientRect(); return [Math.round(Math.min(W,Math.max(0,(e.clientX-r.left)*W/r.width))), Math.round(Math.min(H,Math.max(0,(e.clientY-r.top)*H/r.height)))]; };
  stage.addEventListener('pointerdown', async e=>{
    if(e.button>0) return;
    const p=pt(e);
    if(st.tool==='select') return editAt(p);
    if(st.tool==='text'){
      const r=await dialog({title:'🔤 글자 쓰기', inputs:[{k:'t',label:'판 위에 쓸 글자 (예: 시청, 중앙공원)'}], buttons:[['취소',null],['쓰기','ok','primary']]});
      const text=(r.values?.t||'').trim(); if(r.btn!=='ok'||!text) return;
      commit(()=>st.strokes.push({t:'text', a:p, text:text.slice(0,40), c:st.color, size:Math.max(20, st.width*4)})); return;
    }
    stage.setPointerCapture(e.pointerId);
    if(st.tool==='tree'){ st.hist.push(snapS()); st.fut=[]; cur={t:'tree', last:null, n:0}; plantAt(p); return; }
    if(st.tool==='road'){ const q=[snap(p[0]),snap(p[1])]; cur={t:'road', a:q, b:q, m:st.roadM}; }
    else if(st.tool==='site'||st.tool==='bldg'||st.tool==='green'){ const q=[snap(p[0]),snap(p[1])]; cur={t:st.tool, a:q, b:q}; }
    else if(st.tool==='pen'||st.tool==='eraser') cur={t:st.tool, c:st.color, w:st.tool==='eraser'?st.width*3:st.width, p:[...p]};
    else cur={t:st.tool, c:st.color, w:st.width, a:p, b:p};
    preview();
  });
  stage.addEventListener('pointermove', e=>{
    if(!cur) return; const p=pt(e);
    if(cur.t==='tree'){ plantAt(p); return; }
    if(cur.p){ const n=cur.p.length; if(Math.hypot(p[0]-cur.p[n-2], p[1]-cur.p[n-1])>=2) cur.p.push(p[0],p[1]); }
    else if(cur.t==='road'){ let q=[snap(p[0]),snap(p[1])]; const dx=Math.abs(q[0]-cur.a[0]), dy=Math.abs(q[1]-cur.a[1]);
      if(!e.altKey){ if(dy<dx*0.25) q[1]=cur.a[1]; else if(dx<dy*0.25) q[0]=cur.a[0]; } cur.b=q; }
    else if(cur.t==='site'||cur.t==='bldg'||cur.t==='green') cur.b=[snap(p[0]),snap(p[1])];
    else cur.b=p;
    preview();
  });
  const end=async()=>{
    if(!cur) return; const c=cur; cur=null; xT.clearRect(0,0,W,H);
    if(c.t==='tree'){ if(c.n) changed(); else st.hist.pop(); return; }
    if(c.t==='road'){
      renderMine();
      if(Math.hypot(c.b[0]-c.a[0], c.b[1]-c.a[1]) < 20) return;
      const rd={a:c.a, b:c.b, m:c.m};
      const hitB=[...st.bldgs.map(b=>({b,t:T})), ...otherBldgs()].find(x=>onRoad(x.b,rd));
      if(hitB){ await dialog({title:'⚠️ 도로를 놓을 수 없어요', bad:true, msg:`${hitB.t.name}의 건물${hitB.b.name?`(${hitB.b.name})`:''}과 겹쳐요.\n건물을 피해서 그리거나, 그 조와 상의해요.`}); return; }
      const r=await dialog({title:`🛣️ ${roadGrade(c.m)} ${c.m}m 도로`, msg:`길이 ${fmtN(Math.hypot(c.b[0]-c.a[0],c.b[1]-c.a[1])/PX_PER_M)}m`, inputs:[{k:'name',label:'도로 이름 (선택, 예: 중앙로)'}], buttons:[['취소',null],['놓기','ok','primary']]});
      if(r.btn!=='ok') return;
      commit(()=>st.roads.push({...rd, id:uid(), name:(r.values.name||'').trim().slice(0,12)}));
      return;
    }
    if(c.t==='site'||c.t==='bldg'||c.t==='green'){
      const r=rectOf(c); if(r.w<SNAP||r.h<SNAP){ renderMine(); return; }
      const o={a:[r.x,r.y], b:[r.x+r.w,r.y+r.h]};
      if(c.t==='green'){
        if(st.greens.some(g=>overlaps(g,o))){ await dialog({title:'⚠️ 녹지가 겹쳐요', bad:true, msg:'녹지 구역끼리 겹치면 안 돼요. 빈 곳에 그려요.'}); return; }
        const rdG=allRoads().find(rr=>onRoad(o,rr));
        if(rdG){ await dialog({title:'⚠️ 녹지가 도로를 덮어요', bad:true, msg:`도로(${rdG.name?rdG.name+' · ':''}${roadGrade(rdG.m)} ${rdG.m}m) 위에는 녹지를 만들 수 없어요.\n도로 옆에 그려요.`}); return; }
        const ob=[...st.bldgs.map(b=>({b,t:T})), ...otherBldgs()].find(x=>overlaps(x.b,o));
        if(ob){ await dialog({title:'⚠️ 건물이 있어요', bad:true, msg:`${ob.t.name}의 건물 위에는 녹지를 만들 수 없어요.`}); return; }
        commit(()=>st.greens.push({...o, id:uid(), kind:st.gKind})); toast(`${GKINDS[st.gKind].label} ${fmtN(areaM2(o))}㎡`);
        return;
      }
      if(c.t==='site'){
        if(st.sites.some(s=>overlaps(s,o))){ await dialog({title:'⚠️ 대지가 겹쳐요', bad:true, msg:'대지끼리 겹치면 안 돼요. 빈 곳에 그려요.'}); return; }
        const rdS=allRoads().find(r=>onRoad(o,r));
        if(rdS){ await dialog({title:'⚠️ 대지가 도로를 침범해요', bad:true, msg:`대지가 도로(${rdS.name?rdS.name+' · ':''}${roadGrade(rdS.m)} ${rdS.m}m)와 겹쳐요.\n도로 옆에 붙여서 그려요. (도로에 닿기만 하면 돼요)`}); return; }
        commit(()=>st.sites.push({...o, id:uid()})); toast(`대지${st.sites.length} · ${fmtN(areaM2(o))}㎡`);
      } else await addBldg(o);
      return;
    }
    if(c.t==='eraser'){ renderMine(); }
    st.hist.push(snapS()); st.fut=[]; st.strokes.push(c); changed();
  };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  function plantAt(p){
    if(cur.last && Math.hypot(p[0]-cur.last[0], p[1]-cur.last[1])<34) return;
    if(allRoads().some(r=>segPtDist(p,r.a,r.b)<r.m*PX_PER_M/2+4)) return;
    if([...st.bldgs, ...otherBldgs().map(x=>x.b)].some(b=>hit(b,p))) return;
    st.trees.push({p:[...p], kind:st.tKind, s:st.tKind==='pine'?44:40}); cur.last=p; cur.n++; renderMine();
  }
  function preview(){
    if(cur.t==='eraser'){ renderMine(); xM.save(); drawStroke(xM,cur); xM.restore(); return; }
    xT.clearRect(0,0,W,H);
    if(cur.t==='road'){ xT.save(); xT.globalAlpha=.8; drawRoad(xT, cur, false); xT.restore();
      xT.font="700 16px 'Noto Sans KR', sans-serif"; xT.fillStyle='#1d2533'; xT.fillText(`${roadGrade(cur.m)} ${cur.m}m · 길이 ${fmtN(Math.hypot(cur.b[0]-cur.a[0],cur.b[1]-cur.a[1])/PX_PER_M)}m`, cur.b[0]+12, cur.b[1]-12); return; }
    if(cur.t==='site'||cur.t==='bldg'||cur.t==='green'){
      const r=rectOf(cur), m2=r.w*r.h/(PX_PER_M*PX_PER_M), gk=GKINDS[st.gKind];
      xT.save(); xT.setLineDash(cur.t==='site'?[12,8]:[]); xT.lineWidth=3; xT.strokeStyle=cur.t==='green'?gk.edge:T.color; xT.fillStyle=cur.t==='green'?gk.fill:T.color; xT.globalAlpha=cur.t==='site'?.08:cur.t==='green'?.75:.4;
      xT.fillRect(r.x,r.y,r.w,r.h); xT.globalAlpha=1; xT.strokeRect(r.x,r.y,r.w,r.h);
      xT.font="700 16px 'Noto Sans KR', sans-serif"; xT.fillStyle='#1d2533'; xT.fillText(`${r.w/PX_PER_M}m × ${r.h/PX_PER_M}m = ${fmtN(m2)}㎡`, r.x+4, r.y-8<14?r.y+r.h+18:r.y-8);
      xT.restore(); return;
    }
    drawStroke(xT,cur);
  }
  const key=e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); e.shiftKey?redo():undo(); } };
  const before=e=>{ if(st.dirty){ e.preventDefault(); e.returnValue=''; } };
  window.addEventListener('keydown',key); window.addEventListener('beforeunload',before);
  cleanup=()=>{ window.removeEventListener('keydown',key); window.removeEventListener('beforeunload',before); };
}

function makeLabel(THREE, text, {bg='rgba(255,255,255,.92)', fg='#1d2533', size=28, h=0.9}={}){
  const c=document.createElement('canvas'), x=c.getContext('2d');
  x.font=`700 ${size}px 'Noto Sans KR', sans-serif`;
  const tw=Math.ceil(x.measureText(text).width)+size;
  c.width=tw; c.height=Math.ceil(size*1.6);
  x.font=`700 ${size}px 'Noto Sans KR', sans-serif`;
  x.fillStyle=bg; const r=c.height/2; x.beginPath(); x.moveTo(r,0); x.lineTo(tw-r,0); x.arc(tw-r,r,r,-Math.PI/2,Math.PI/2); x.lineTo(r,c.height); x.arc(r,r,r,Math.PI/2,Math.PI*1.5); x.fill();
  x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text, tw/2, c.height/2+1);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  sp.scale.set(h*c.width/c.height, h, 1); sp.renderOrder=10;
  return sp;
}

    // 날씨 효과
    if(fx){ const p=fx.geometry.attributes.position, arr=p.array, sp=fx.userData.kind==='snow'?4:2.5;
      for(let i=0;i<arr.length;i+=3){ arr[i+1]-=sp*dt; arr[i]+=Math.sin(ts+i)*0.02; if(arr[i+1]<0){ arr[i+1]=55; arr[i]=(Math.random()-.5)*120; arr[i+2]=(Math.random()-.5)*120; } }
      p.needsUpdate=true; fx.position.set(px,0,pz); }
    // 카메라
    const cp=Math.cos(camPitch), tx=px, ty=baseY()+py+1.6, tz=pz;
    camera.position.set(tx+Math.sin(camYaw)*cp*camDist, ty+Math.sin(camPitch)*camDist, tz+Math.cos(camYaw)*cp*camDist);
    camera.lookAt(tx,ty,tz);
    renderer.render(scene,camera);
    // 미니맵 (레이더가 있어야 친구가 보여요)
    mx.drawImage(miniBase,0,0);
    if(has('radar')||S.hu) Object.values(remotes).forEach(rm=>{ if(!rm.visible) return; const g=rm.av.g; if(!S.hu && Math.hypot(g.position.x-px,g.position.z-pz)>60+20*lv('radar')) return; const [a,b]=toP(g.position.x,g.position.z); mx.fillStyle=rm.hu?'#f2c94c':'#2f6fd6'; mx.beginPath(); mx.arc(a/5,b/5,3.5,0,Math.PI*2); mx.fill(); });
    roofs.forEach(r=>{ const [a,b]=toP(r.door.x,r.door.z); mx.fillStyle='#f2c94c'; mx.fillRect(a/5-1.5,b/5-1.5,3,3); });
    const [ma,mb]=toP(px,pz); mx.save(); mx.translate(ma/5,mb/5); mx.rotate(-face); mx.fillStyle='#d64545'; mx.beginPath(); mx.moveTo(0,6); mx.lineTo(-4,-4); mx.lineTo(4,-4); mx.closePath(); mx.fill(); mx.restore();
    showInfo(findInfo());
    if(t-hudT>120){ hudT=t; hud(); }
    send(t);
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);

  cleanup=()=>{ alive=false; cancelAnimationFrame(raf); ro.disconnect(); clearTimeout(countdownT);
    window.removeEventListener('keydown',onKey); window.removeEventListener('keyup',onKey); window.removeEventListener('blur',blurKeys);
    if(fb){ try{ fb.dbM.remove(myRef); fb.dbM.goOffline(fb.db); fb.appM.deleteApp(fb.fapp); }catch(e){} }
    renderer.dispose(); };
}

/* ============ 선생님 화면 ============ */
async function teacherPage(app, cls){
  setCrumb([['반 선택','#'],[clsName(cls),`#/c/${cls}`],['선생님']]);
  if(!fbUrl()){ app.innerHTML=`<h2>👩‍🏫 선생님 화면</h2><div class="card">함께 걷기(Firebase) 주소가 아직 연결되지 않았어요.<br>배포방법.txt의 "Firebase 무료 설정"을 따라 주소를 넣으면 대기실·시작·초기화를 쓸 수 있어요.</div>`; return; }
  app.innerHTML=`<p class="muted">연결 중…</p>`;
  let fb; try{ fb=await loadFirebase('teacher-'+uid()); }catch(e){ app.innerHTML='<div class="card">Firebase에 연결하지 못했어요. 주소를 확인해 주세요.</div>'; return; }
  const {dbM, db}=fb; let off=0; dbM.onValue(dbM.ref(db,'.info/serverTimeOffset'), s=>{ off=s.val()||0; });
  const hashRef=dbM.ref(db,'teacher/hash');
  const hashVal=await new Promise(res=>{ let done=false; dbM.onValue(hashRef, s=>{ if(!done){ done=true; res(s.val()); } }); setTimeout(()=>{ if(!done){ done=true; res(null); } }, 4000); });
  cleanup=()=>{ try{ dbM.goOffline(db); fb.appM.deleteApp(fb.fapp); }catch(e){} };
  const okKey='teacherOK';
  const unlocked = sessionStorage.getItem(okKey)===hashVal && !!hashVal;
  if(!unlocked){
    app.innerHTML=`<h2>👩‍🏫 선생님 화면 — ${clsName(cls)}</h2><div class="card form" style="max-width:460px">
      ${hashVal?'<label>선생님 비밀번호</label><input id="tp1" type="password">':'<p>처음 사용이에요. <b>선생님 비밀번호</b>를 정해 주세요. (9개 반 공통, 6자 이상 권장)<br><span class="muted">한 번 정하면 Firebase 데이터 탭에서만 바꿀 수 있어요.</span></p><label>비밀번호</label><input id="tp1" type="password"><label>한 번 더</label><input id="tp2" type="password">'}
      <button class="btn primary" id="tGo" style="margin-top:12px">${hashVal?'들어가기':'비밀번호 정하기'}</button></div>`;
    $('#tGo').onclick=async()=>{
      const p1=$('#tp1').value;
      if(!hashVal){ if(p1.length<4){ toast('4자 이상으로 정해 주세요'); return; } if(p1!==$('#tp2').value){ toast('두 비밀번호가 달라요'); return; }
        const h=await sha256('city:'+p1); try{ await dbM.set(hashRef, h); sessionStorage.setItem(okKey,h); teacherPage(app,cls); }catch(e){ toast('저장하지 못했어요: 규칙을 확인해 주세요'); } return; }
      const h=await sha256('city:'+p1); if(h!==hashVal){ toast('비밀번호가 달라요'); return; }
      sessionStorage.setItem(okKey,h); teacherPage(app,cls);
    };
    return;
  }
  let game={state:'lobby', bg:'day', round:'', dur:900}, players={}, ranks={};
  app.innerHTML=`<h2>👩‍🏫 선생님 화면 — ${clsName(cls)} 동전 게임</h2>
    <div class="workspace">
      <div>
        <div class="card">
          <h3 style="margin-top:0">1. 배경 고르기 <span class="muted">(학생 화면에 바로 적용)</span></h3>
          <div class="tbg">${Object.entries(THEMES).map(([k,v])=>`<button class="btn" data-bg="${k}">${v.label}</button>`).join('')}</div>
          <h3>2. 게임 시간</h3>
          <div class="tbg">${[[600,'10분'],[900,'15분'],[1200,'20분'],[0,'시간 제한 없음']].map(([v,l])=>`<button class="btn" data-dur="${v}">${l}</button>`).join('')}</div>
          <h3>3. 동전 총량 <span class="muted">(처음 30% → 45초마다 5%씩 → 총량에서 멈춤)</span></h3>
          <div class="tbg">${[['auto','자동 (접속 인원 × 80)'],['1500','1500개'],['2000','2000개'],['2500','2500개']].map(([v,l])=>`<button class="btn" data-coin="${v}">${l}</button>`).join('')}</div>
          <h3>4. 진행</h3>
          <div class="tbg">
            <button class="btn" id="tLobby">🚪 대기실 열기 / 판 초기화</button>
            <button class="btn primary" id="tStart" style="font-size:17px">▶ 시작 (3초 뒤)</button>
            <button class="btn danger" id="tEnd">■ 끝내기</button>
            <button class="btn" id="tChat">💬 채팅 지우기</button>
          </div>
          <p class="muted" id="tState" style="margin-top:10px"></p>
          <p class="muted">순서: ① 대기실 열기 → ② 학생들이 "우리 도시 걸어 보기"로 들어옴 → ③ 다 들어오면 시작 → ④ 끝나면 판 초기화</p>
        </div>
      </div>
      <div>
        <div class="card"><h3 style="margin-top:0">🏆 사람이 된 순서</h3><div id="tRanks" class="muted">아직 없어요</div></div>
        <div class="card" style="margin-top:12px"><h3 style="margin-top:0">접속한 학생 <span id="tCount"></span></h3><div id="tPlayers" class="muted">아직 없어요</div></div>
      </div>
    </div>`;
  const gRef=dbM.ref(db,`rooms/${cls}/game`);
  const now2=()=>Date.now()+off;
  const render=()=>{
    app.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('on', b.dataset.bg===(game.bg||'day')));
    app.querySelectorAll('[data-dur]').forEach(b=>b.classList.toggle('on', +b.dataset.dur===(game.dur??900)));
    app.querySelectorAll('[data-coin]').forEach(b=>b.classList.toggle('on', b.dataset.coin===(game.coinOpt||'auto')));
    const st={lobby:'🚪 대기실 (학생들이 들어오는 중)', play:'▶ 게임 중', end:'🏁 끝남'}[game.state]||'';
    const left= game.state==='play'&&game.dur ? Math.max(0, game.startAt+game.dur*1000-now2()) : null;
    $('#tState').innerHTML=`지금 상태: <b>${st}</b>${game.state==='play'&&game.total?` · 동전 총 ${game.total}개`:''}${left!=null?` · 남은 시간 ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`:''}`;
    const list=Object.values(players).filter(Boolean).sort((a,b)=>(b.hu-a.hu)||((+b.k||0)-(+a.k||0)));
    $('#tCount').textContent=`(${list.length}명)`;
    $('#tPlayers').innerHTML= list.length? `<table class="tbl"><tr><th>이름</th><th>동전</th><th>스탯 🏃⚡🫣🛡️</th><th>아이템</th><th>상태</th></tr>${list.map(p=>`<tr><td>${esc(cleanChat(p.n).slice(0,8))}</td><td>${+p.k||0}</td><td>${String(p.sl||'0,0,0,0').split(',').map(x=>+x||0).join(' · ')}</td><td>${String(p.it||'').split(',').filter(Boolean).map(x=>{ const [i,l]=x.split(':'); return (ITEMS[i]?.icon||'')+(+l?`+${+l}`:''); }).join(' ')}</td><td>${p.hu?'🧑 변신':'🐾'}</td></tr>`).join('')}</table>` : '아직 없어요';
    const rl=Object.values(ranks).sort((a,b)=>a.t-b.t);
    $('#tRanks').innerHTML= rl.length? rl.map((r,i)=>`${i+1}. ${esc(cleanChat(r.n).slice(0,8))}`).join('<br>') : '아직 없어요';
  };
  let rankRefPath='';
  dbM.onValue(gRef, s=>{ game={state:'lobby', bg:'day', round:'', dur:900, ...(s.val()||{})};
    if(game.round && rankRefPath!==game.round){ rankRefPath=game.round; ranks={}; dbM.onChildAdded(dbM.ref(db,`rooms/${cls}/ranks/${game.round}`), r=>{ if(game.round===rankRefPath){ ranks[r.key]=r.val(); render(); } }); }
    render(); });
  const pRef=dbM.ref(db,`rooms/${cls}/players`);
  dbM.onChildAdded(pRef, s=>{ players[s.key]=s.val(); render(); }); dbM.onChildChanged(pRef, s=>{ players[s.key]=s.val(); render(); });
  dbM.onChildRemoved(pRef, s=>{ delete players[s.key]; render(); });
  const timer=setInterval(render, 1000); const prevClean=cleanup; cleanup=()=>{ clearInterval(timer); prevClean(); };
  app.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>dbM.update(gRef,{bg:b.dataset.bg}));
  app.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>dbM.update(gRef,{dur:+b.dataset.dur}));
  app.querySelectorAll('[data-coin]').forEach(b=>b.onclick=()=>dbM.update(gRef,{coinOpt:b.dataset.coin}));
  $('#tLobby').onclick=async()=>{
    if(game.state==='play'){ const r=await dialog({title:'판 초기화', msg:'게임 중이에요. 초기화하면 모든 학생의 동전·아이템·순위가 지워지고 대기실로 돌아가요.', buttons:[['취소',false],['초기화',true,'danger']]}); if(!r.btn) return; }
    await Promise.all(['taken','ranks','events'].map(k=>dbM.remove(dbM.ref(db,`rooms/${cls}/${k}`)).catch(()=>{})));
    await dbM.set(gRef, {state:'lobby', bg:game.bg||'day', dur:game.dur??900, coinOpt:game.coinOpt||'auto', round:roomId(), seed:Math.floor(Math.random()*1e9)});
    toast('대기실을 열었어요. 학생들이 들어오면 시작을 눌러요.');
  };
  $('#tStart').onclick=async()=>{
    if(game.state==='play'){ toast('이미 게임 중이에요'); return; }
    const nP=Object.values(players).filter(Boolean).length, opt=game.coinOpt||'auto';
    const total = opt==='auto' ? Math.max(600, nP*80) : (+opt||2000);
    const upd={state:'play', startAt:now2()+3500, seed:Math.floor(Math.random()*1e9), total};
    if(!game.round || game.state==='end'){ await Promise.all(['taken','ranks','events'].map(k=>dbM.remove(dbM.ref(db,`rooms/${cls}/${k}`)).catch(()=>{}))); upd.round=roomId(); }
    await dbM.update(gRef, upd); toast(`3초 뒤 시작해요! (동전 총 ${total}개)`);
  };
  $('#tEnd').onclick=async()=>{ if(game.state!=='play'){ toast('게임 중이 아니에요'); return; } const r=await dialog({title:'끝내기', msg:'지금 게임을 끝낼까요?', buttons:[['취소',false],['끝내기',true,'danger']]}); if(r.btn) dbM.update(gRef,{state:'end'}); };
  $('#tChat').onclick=async()=>{ const r=await dialog({title:'채팅 지우기', msg:'이 반 채팅 기록을 모두 지울까요?', buttons:[['취소',false],['지우기',true,'danger']]}); if(r.btn){ await dbM.remove(dbM.ref(db,`rooms/${cls}/chat`)).catch(()=>{}); toast('채팅을 지웠어요 (학생 화면은 새로 들어오면 비어 있어요)'); } };
}
