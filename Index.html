<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 도시 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1d2533; --sub:#5b6577; --line:#dfe4ec; --navy:#1f3864; --accent:#2e5395;
  --ok:#2e9e5b; --warn:#c0392b; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
a{color:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
header.top h1{font-size:18px;margin:0;font-weight:700;cursor:pointer;white-space:nowrap}
header.top .crumb{font-size:14px;opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .crumb a{text-decoration:none}
header.top .crumb a:hover{text-decoration:underline}
main{max-width:1440px;margin:0 auto;padding:18px 16px 60px}
.banner{background:#fff4d6;border:1px solid #f0d58a;color:#6b5200;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
h2{font-size:20px;margin:6px 0 14px;color:var(--navy)}
h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;padding:8px 12px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{background:#f0f3f8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#244579}
.btn.danger{color:var(--warn);border-color:#efc3bd}
.btn:disabled{opacity:.5;cursor:default}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grade h3{margin-top:0}
.classbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.classbtns a{padding:18px 0;font-size:17px}
.cityrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.cityrow input{font:inherit;font-size:17px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:200px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.team{border-left:6px solid var(--c);display:flex;flex-direction:column;gap:6px;text-decoration:none}
.team:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.team b{font-size:17px}
.team .meta{font-size:13px;color:var(--sub)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);vertical-align:middle;margin-right:4px}
.stage{position:relative;width:100%;aspect-ratio:1400/990;background:#fff;border:1px solid #c9d1dd;border-radius:6px;overflow:hidden;touch-action:none;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage.v3d{background:linear-gradient(#dfeaf7,#f7f9fc);cursor:grab}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1050px){.workspace{grid-template-columns:1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tool{padding:6px 10px}
.tool.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tool.key{border-color:#9fb3d6;background:#eef3fb}
.tool.key.on{background:var(--navy)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #aab;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px 8px 0 0;font:inherit;font-weight:700;cursor:pointer;color:var(--sub)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.status{font-size:13px;color:var(--sub);margin-left:auto}
.status.dirty{color:var(--warn);font-weight:700}
.status.saved{color:var(--ok)}
.form label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.form input,.form textarea{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form textarea{min-height:56px;resize:vertical}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.out{background:#eef2fa;border-radius:8px;padding:8px 10px;font-weight:700;color:var(--navy)}
.out small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.out.bad{background:#fdecea;color:var(--warn)}
.bar{height:8px;background:#dfe4ec;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.bad{background:var(--warn)}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.hint.bad{color:var(--warn);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 6px;text-align:center}
.tbl th{background:#e8edf6}
.tbl input{padding:5px 6px}
.tbl .bad{color:var(--warn);font-weight:700}
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;border-left:6px solid var(--c)}
.layer input[type=range]{width:100%}
table.sum{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;background:#fff}
table.sum th,table.sum td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sum th{background:#e8edf6}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.checks li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:460px;width:100%}
.modal .title{font-weight:700;font-size:17px;margin-bottom:8px}
.modal .title.bad{color:var(--warn)}
.modal .msg{white-space:pre-line;line-height:1.65}
.modal label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.modal input{width:100%;font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2533;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
.muted{color:var(--sub);font-size:13px}
.v3tools{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3}
.v3tools button{min-height:32px;padding:4px 10px;background:rgba(255,255,255,.92)}
.v3tip{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--sub);z-index:3;background:rgba(255,255,255,.8);padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<header class="top">
  <h1 onclick="location.hash=''">🏙️ 우리 반 도시 만들기</h1>
  <div class="crumb" id="crumb"></div>
</header>
<main id="app"></main>

<script>
/* ============ 기본 설정 ============ */
const W = 1400, H = 990;          // 판 크기(픽셀)
const PX_PER_M = 5;               // 작은 칸 50px = 10m
const FLOOR_M = 3;                // 한 층 높이 3m
const SNAP = 10;                  // 대지·건물은 2m 단위로 맞춤
const BOARD_AREA = (W/PX_PER_M)*(H/PX_PER_M); // 55,440㎡
const TEAMS = [
  {id:'landmark', name:'랜드마크조', color:'#d64545', zone:'상업지 · 경관지구 주변'},
  {id:'housing',  name:'주거조',     color:'#e08a1e', zone:'제1·2·3종 일반주거지역'},
  {id:'green',    name:'녹지조',     color:'#2e9e5b', zone:'자연녹지 · 생산녹지 · 보전녹지'},
  {id:'commerce', name:'상업조',     color:'#2f6fd6', zone:'근린상업 · 일반상업 · 중심상업'},
  {id:'traffic',  name:'교통·도로조', color:'#4a4a4a', zone:'모든 구역을 잇는 도로 · 대중교통'},
];
const TEAM = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const STACK = ['green','traffic','housing','commerce','landmark'];
const CITIES = ['서울','부산','인천(송도)','대구','대전','세종','수원','창원','창녕'];
// 국토계획법 시행령 상한 (건폐율 %, 용적률 %)
const CAPS = {
  '제1종전용주거지역':[50,100],'제2종전용주거지역':[50,150],'제1종일반주거지역':[60,200],'제2종일반주거지역':[60,250],
  '제3종일반주거지역':[50,300],'준주거지역':[70,500],'중심상업지역':[90,1500],'일반상업지역':[80,1300],'근린상업지역':[70,900],
  '유통상업지역':[80,1100],'전용공업지역':[70,300],'일반공업지역':[70,350],'준공업지역':[70,400],'보전녹지지역':[20,80],
  '생산녹지지역':[20,100],'자연녹지지역':[20,100],'계획관리지역':[40,100],'생산관리지역':[20,80],'보전관리지역':[20,80]
};
const TEAM_FIELDS = {
  landmark: [['lmName','랜드마크 이름과 종류 (예: 타워, 다리, 문화회관)'],['lmPlace','위치 (어느 구역 가까이?)'],['lmWhy','이 건물이 우리 도시를 상징하는 이유','area']],
  housing:  [['hType','선택한 주거지역 (몇 종?)'],['hCount','예상 세대 수 / 단독주택 · 아파트 비율'],['hInfra','집 근처 필요한 인프라 (학교 · 공원 …)','area']],
  green:    [['gType','녹지 종류 (공원 / 숲 / 하천 / 농지)'],['gRatio','도시 면적 대비 녹지 비율 목표 (%)'],['gGood','녹지가 도시에 주는 좋은 점 2가지','area'],['gBelt','개발제한구역(그린벨트)이 있나요? 있다면 어디?']],
  commerce: [['cType','상업지역 종류와 이유','area'],['cShops','들어올 가게 · 시설 (시장, 마트, 영화관 …)'],['cWhy','사람들이 모이는 이유 (역세권? 큰길?)']],
  traffic:  [['tNames','우리 도시의 큰 도로(중로 · 대로) 이름'],['tTransit','대중교통 계획 (버스 · 지하철 · 기차역)','area'],['tParking','주차장 위치']],
};
const PALETTE = ['#1d2533','#8a8f99','#d64545','#e08a1e','#e6c229','#2e9e5b','#2f6fd6','#7a4fd0','#8b5a2b','#ffffff'];

/* ============ 작은 도구들 ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clsName = c => `${c[0]}학년 ${c[2]}반`;
const fmtTime = iso => { if(!iso) return ''; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const num = v => { const n=parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:null; };
const r1 = n => Math.round(n*10)/10;
const fmtN = n => n==null?'―':(Math.round(n*10)/10).toLocaleString('ko-KR');
const snap = v => Math.round(v/SNAP)*SNAP;
const rectOf = o => ({x:Math.min(o.a[0],o.b[0]), y:Math.min(o.a[1],o.b[1]), w:Math.abs(o.a[0]-o.b[0]), h:Math.abs(o.a[1]-o.b[1])});
const areaM2 = o => { const r=rectOf(o); return r.w*r.h/(PX_PER_M*PX_PER_M); };
const inside = (inner, outer) => { const a=rectOf(inner), b=rectOf(outer); return a.x>=b.x && a.y>=b.y && a.x+a.w<=b.x+b.w && a.y+a.h<=b.y+b.h; };
const overlaps = (p, q) => { const a=rectOf(p), b=rectOf(q); return a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h; };
const hit = (o, p) => { const r=rectOf(o); return p[0]>=r.x && p[0]<=r.x+r.w && p[1]>=r.y && p[1]<=r.y+r.h; };
const uid = () => Math.random().toString(36).slice(2,9);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
// 모달: buttons [[label, value, class]], inputs [{k,label,type,value,placeholder}]
function dialog({title='', msg='', bad=false, inputs=[], buttons=[['확인',true,'primary']]}){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="card">${title?`<div class="title${bad?' bad':''}">${esc(title)}</div>`:''}<div class="msg">${esc(msg)}</div>
      ${inputs.map(i=>`<label>${esc(i.label)}</label><input data-k="${i.k}" type="${i.type||'text'}" ${i.type==='number'?'inputmode="numeric" min="1"':''} value="${esc(i.value??'')}" placeholder="${esc(i.placeholder||'')}">`).join('')}
      <div class="acts"></div></div>`;
    const vals=()=>Object.fromEntries([...m.querySelectorAll('input[data-k]')].map(i=>[i.dataset.k,i.value]));
    buttons.forEach(([label,val,cls])=>{ const b=document.createElement('button'); b.className='btn '+(cls||''); b.textContent=label; b.onclick=()=>{m.remove();res({btn:val, values:vals()})}; $('.acts',m).appendChild(b); });
    m.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const p=buttons.find(b=>b[2]==='primary'); if(p){ m.remove(); res({btn:p[1], values:vals()}); } } });
    document.body.appendChild(m);
    const f=m.querySelector('input'); if(f){ f.focus(); f.select(); }
  });
}
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
};

/* ============ API (서버, 없으면 이 기기 저장) ============ */
let OFFLINE = false;
async function apiGet(cls, team){
  if(!OFFLINE){
    try{
      const r = await fetch(`/api/data?cls=${cls}${team?'&team='+team:''}`, {cache:'no-store'});
      if(r.ok && (r.headers.get('content-type')||'').includes('json')) return await r.json();
      throw new Error('no api');
    }catch(e){ OFFLINE = true; }
  }
  if(team) return ls.get(`cp:${cls}/${team}`);
  const out={meta:ls.get(`cp:${cls}/meta`), teams:{}};
  TEAMS.forEach(t=>out.teams[t.id]=ls.get(`cp:${cls}/${t.id}`));
  return out;
}
async function apiPut(cls, team, body){
  if(!OFFLINE){
    try{
      const r = await fetch(`/api/data?cls=${cls}&team=${team}`, {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
      const j = await r.json();
      if(r.status===409) return {conflict:true, current:j.current};
      if(!r.ok) throw new Error(j.error||r.status);
      return j;
    }catch(e){ return {error:String(e.message||e)}; }
  }
  const key=`cp:${cls}/${team}`, cur=ls.get(key), v=cur?.version??0;
  if(!body.force && (body.baseVersion??0)!==v) return {conflict:true, current:cur};
  const rec={data:body.data, version:v+1, savedAt:new Date().toISOString(), savedBy:body.savedBy||''};
  ls.set(key, rec); return {ok:true, version:rec.version, savedAt:rec.savedAt};
}

/* ============ 규칙 계산 ============ */
// 조 하나의 대지·건물을 상한과 비교
function evalTeam(fields, data){
  const f=fields||{}, sites=data?.sites||[], bldgs=data?.bldgs||[];
  const capB=num(f.bcr), capF=num(f.far);
  const per = sites.map((s,i)=>({i:i+1, id:s.id, area:areaM2(s), foot:0, gfa:0, n:0}));
  const orphan=[];
  bldgs.forEach(b=>{ const k=sites.findIndex(s=>inside(b,s)); const fa=areaM2(b);
    if(k<0){ orphan.push(b); return; } per[k].foot+=fa; per[k].gfa+=fa*b.floors; per[k].n++; });
  per.forEach(p=>{ p.bcr=p.area?p.foot/p.area*100:0; p.far=p.area?p.gfa/p.area*100:0;
    p.overB = capB!=null && p.bcr > capB+1e-9; p.overF = capF!=null && p.far > capF+1e-9; });
  const siteArea=per.reduce((a,p)=>a+p.area,0), foot=per.reduce((a,p)=>a+p.foot,0), gfa=per.reduce((a,p)=>a+p.gfa,0);
  const maxFloors=bldgs.reduce((m,b)=>Math.max(m,b.floors||0),0);
  const issues=[];
  per.forEach(p=>{ if(p.overB) issues.push(`대지${p.i} 건폐율 ${r1(p.bcr)}% > 상한 ${capB}%`); if(p.overF) issues.push(`대지${p.i} 용적률 ${r1(p.far)}% > 상한 ${capF}%`); });
  if(orphan.length) issues.push(`대지 밖 건물 ${orphan.length}개`);
  const hl=num(f.hLimit); if(hl!=null && maxFloors*FLOOR_M>hl) issues.push(`높이 ${maxFloors*FLOOR_M}m > 고도 제한 ${hl}m`);
  return {capB, capF, per, siteArea, foot, gfa, maxFloors, bcrNow: siteArea?foot/siteArea*100:0, farNow: siteArea?gfa/siteArea*100:0, issues, nB:bldgs.length};
}
function nationalCap(f){ return CAPS[(f?.zone||'').replace(/\s/g,'')]; }

/* ============ 평면 그리기 ============ */
function drawBg(ctx){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#eef1f5'; ctx.lineWidth=1;
  for(let x=50;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=50;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='#dde2ea';
  for(let x=250;x<W;x+=250){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=250;y<H;y+=250){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='#888'; ctx.lineWidth=3;
  [[30,30],[W-30,30],[30,H-30],[W-30,H-30]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+14,y);ctx.moveTo(x,y-14);ctx.lineTo(x,y+14);ctx.stroke();});
  ctx.fillStyle='#9aa3b2'; ctx.font="13px 'Noto Sans KR', sans-serif"; ctx.fillText('작은 칸 1칸 = 10m × 10m (100㎡)', 56, H-24);
}
function drawStroke(ctx, s){
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=s.w||4;
  if(s.t==='eraser'){ ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='#000'; ctx.fillStyle='#000'; }
  else { ctx.strokeStyle=s.c; ctx.fillStyle=s.c; }
  if(s.t==='pen'||s.t==='eraser'){
    const p=s.p; if(!p||p.length<2){ctx.restore();return;}
    if(p.length===2){ ctx.beginPath(); ctx.arc(p[0],p[1],ctx.lineWidth/2,0,Math.PI*2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]); ctx.stroke(); }
  } else if(s.t==='line'){
    ctx.beginPath(); ctx.moveTo(s.a[0],s.a[1]); ctx.lineTo(s.b[0],s.b[1]); ctx.stroke();
  } else if(s.t==='rect'||s.t==='fill'){
    const r=rectOf(s);
    if(s.t==='fill'){ ctx.globalAlpha=.35; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1; }
    ctx.strokeRect(r.x,r.y,r.w,r.h);
  } else if(s.t==='text'){
    ctx.font=`700 ${s.size||28}px 'Noto Sans KR', sans-serif`; ctx.textBaseline='middle';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.strokeText(s.text,s.a[0],s.a[1]);
    ctx.fillText(s.text,s.a[0],s.a[1]);
  }
  ctx.restore();
}
function drawSite(ctx, s, i, color){
  const r=rectOf(s);
  ctx.save(); ctx.globalAlpha=.07; ctx.fillStyle=color; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1;
  ctx.setLineDash([12,8]); ctx.lineWidth=3; ctx.strokeStyle=color; ctx.strokeRect(r.x,r.y,r.w,r.h); ctx.setLineDash([]);
  ctx.font="700 15px 'Noto Sans KR', sans-serif"; ctx.fillStyle=color; ctx.textBaseline='top';
  ctx.fillText(`대지${i+1} · ${fmtN(areaM2(s))}㎡`, r.x+6, r.y+5);
  ctx.restore();
}
function drawBldg(ctx, b, color){
  const r=rectOf(b);
  ctx.save(); ctx.globalAlpha=.6; ctx.fillStyle=color; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1;
  ctx.lineWidth=2.5; ctx.strokeStyle=shade(color,-.35); ctx.strokeRect(r.x,r.y,r.w,r.h);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs=Math.max(11,Math.min(20,r.w/4,r.h/2.2)); ctx.font=`700 ${fs}px 'Noto Sans KR', sans-serif`;
  ctx.fillText(`${b.floors}층`, r.x+r.w/2, r.y+r.h/2 - (b.name?fs*.55:0));
  if(b.name){ ctx.font=`500 ${Math.max(10,fs*.75)}px 'Noto Sans KR', sans-serif`; ctx.fillText(b.name.slice(0,10), r.x+r.w/2, r.y+r.h/2+fs*.6); }
  ctx.restore();
}
// data: {strokes, sites, bldgs}
function drawLayer(ctx, data, color, {bldgs=true}={}){
  ctx.clearRect(0,0,W,H);
  (data?.strokes||[]).forEach(s=>drawStroke(ctx,s));
  (data?.sites||[]).forEach((s,i)=>drawSite(ctx,s,i,color));
  if(bldgs) (data?.bldgs||[]).forEach(b=>drawBldg(ctx,b,color));
}
function mkCanvas(w=W,h=H){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function shade(hex, amt){ // amt -1..1
  const n=parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const t=amt<0?0:255, p=Math.abs(amt); r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return `rgb(${r},${g},${b})`;
}

/* ============ 입체(3D) 보기 ============ */
const BG_CANVAS = (()=>{ const c=mkCanvas(); drawBg(c.getContext('2d')); return c; })();
// layers: [{color, ground(canvas), bldgs, alpha}]
function render3D(cv, layers, view){
  const ctx=cv.getContext('2d'), cw=cv.width, ch=cv.height;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cw,ch);
  const th=view.angle*Math.PI/180, co=Math.cos(th), si=Math.sin(th), C30=Math.cos(Math.PI/6), ZS=PX_PER_M*FLOOR_M;
  const rot=(X,Y)=>{ const x=X-W/2, y=Y-H/2; return [x*co-y*si, x*si+y*co]; };
  const p0=(X,Y,Z)=>{ const [a,b]=rot(X,Y); return [(a-b)*C30, (a+b)*0.5 - Z]; };
  let maxZ=0; layers.forEach(l=>(l.bldgs||[]).forEach(b=>maxZ=Math.max(maxZ,(b.floors||0)*ZS)));
  const pts=[]; [[0,0],[W,0],[W,H],[0,H]].forEach(([x,y])=>{ pts.push(p0(x,y,0)); pts.push(p0(x,y,maxZ)); });
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const k=Math.min(cw*.92/(maxx-minx), ch*.9/(maxy-miny))*view.zoom;
  const ox=cw/2-k*(minx+maxx)/2 + view.panX, oy=ch/2-k*(miny+maxy)/2 + view.panY;
  const P=(X,Y,Z)=>{ const q=p0(X,Y,Z); return [ox+k*q[0], oy+k*q[1]]; };
  // 땅(평면 그림)
  const O=P(0,0,0), ex=P(1,0,0), ey=P(0,1,0);
  ctx.save(); ctx.setTransform(ex[0]-O[0], ex[1]-O[1], ey[0]-O[0], ey[1]-O[1], O[0], O[1]);
  ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=30; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.shadowBlur=0;
  ctx.drawImage(BG_CANVAS,0,0);
  layers.forEach(l=>{ if(l.ground){ ctx.globalAlpha=l.alpha??1; ctx.drawImage(l.ground,0,0); } });
  ctx.restore();
  // 건물 (먼 것부터)
  const boxes=[];
  layers.forEach(l=>(l.bldgs||[]).forEach(b=>{ const r=rectOf(b); const [a,c]=rot(r.x+r.w/2, r.y+r.h/2); boxes.push({b,r,color:l.color,alpha:l.alpha??1,depth:a+c}); }));
  boxes.sort((u,v)=>u.depth-v.depth);
  const faces=[[0,1,0,-1],[1,2,1,0],[2,3,0,1],[3,0,-1,0]];
  boxes.forEach(({b,r,color,alpha})=>{
    const h=(b.floors||1)*ZS, cs=[[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]];
    ctx.save(); ctx.globalAlpha=alpha; ctx.lineJoin='round';
    faces.forEach(([i,j,nx,ny])=>{
      const nxr=nx*co-ny*si, nyr=nx*si+ny*co; if(nxr+nyr<=0) return;
      const A=cs[i], B=cs[j]; const q=[P(A[0],A[1],0),P(B[0],B[1],0),P(B[0],B[1],h),P(A[0],A[1],h)];
      ctx.beginPath(); q.forEach((p,n)=>n?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
      ctx.fillStyle=shade(color, nxr-nyr>0? -.05 : -.3); ctx.fill();
      ctx.strokeStyle=shade(color,-.5); ctx.lineWidth=1; ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1;
      for(let f=1; f<(b.floors||1); f++){ const z=f*ZS; const s1=P(A[0],A[1],z), s2=P(B[0],B[1],z); ctx.beginPath(); ctx.moveTo(s1[0],s1[1]); ctx.lineTo(s2[0],s2[1]); ctx.stroke(); }
    });
    const top=cs.map(([x,y])=>P(x,y,h));
    ctx.beginPath(); top.forEach((p,n)=>n?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
    ctx.fillStyle=shade(color,.25); ctx.fill(); ctx.strokeStyle=shade(color,-.5); ctx.stroke();
    const tc=P(r.x+r.w/2, r.y+r.h/2, h);
    if(k*Math.min(r.w,r.h)>22){ ctx.fillStyle='#1d2533'; ctx.font=`700 ${Math.max(11,Math.min(16,k*r.w/4))}px 'Noto Sans KR', sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(`${b.floors}층`, tc[0], tc[1]); }
    ctx.restore();
  });
  if(!boxes.length){ ctx.fillStyle='#5b6577'; ctx.font="600 20px 'Noto Sans KR', sans-serif"; ctx.textAlign='center'; ctx.fillText('아직 지은 건물이 없어요. 평면에서 대지 → 건물 순서로 그려 보세요.', cw/2, 40); }
}
function make3DView(stage, getLayers){
  stage.classList.add('v3d');
  const cv=mkCanvas(W,H); stage.appendChild(cv);
  const view={angle:0, zoom:1, panX:0, panY:0};
  stage.insertAdjacentHTML('beforeend',`<div class="v3tools"><button class="btn" data-v="l">⟲</button><button class="btn" data-v="r">⟳</button><button class="btn" data-v="in">＋</button><button class="btn" data-v="out">－</button><button class="btn" data-v="0">처음</button></div><div class="v3tip">드래그: 돌리기 · Shift+드래그: 옮기기 · 휠: 확대</div>`);
  const draw=()=>render3D(cv, getLayers(), view);
  stage.querySelectorAll('[data-v]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const v=b.dataset.v;
    if(v==='l') view.angle-=45; if(v==='r') view.angle+=45; if(v==='in') view.zoom*=1.2; if(v==='out') view.zoom/=1.2; if(v==='0'){view.angle=0;view.zoom=1;view.panX=0;view.panY=0;} draw(); });
  let drag=null;
  cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2}; cv.setPointerCapture(e.pointerId); stage.style.cursor='grabbing'; });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const r=cv.getBoundingClientRect(), sc=W/r.width; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.pan){ view.panX+=dx*sc; view.panY+=dy*sc; } else view.angle+=dx*0.4; draw(); });
  const up=()=>{ drag=null; stage.style.cursor=''; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); view.zoom*=e.deltaY<0?1.1:1/1.1; draw(); },{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  draw();
  return {draw};
}
function groundOf(data,color){ const c=mkCanvas(); drawLayer(c.getContext('2d'),data,color,{bldgs:false}); return c; }

          <div class="out"><small>⑥ 건축면적 최대</small><span id="oBuild">―</span></div>
          <div class="out"><small>⑦ 연면적 최대</small><span id="oFloor">―</span></div>
          <div class="out" style="grid-column:1/3"><small>⑧ 최대 층수 ≈ 용적률 ÷ 건폐율 (땅을 꽉 채워 지을 때)</small><span id="oFloors">―</span></div>
          <div class="out" id="nowB"><small>지금 건폐율 (건축면적 ÷ 대지면적)</small><span></span><div class="bar"><i></i></div></div>
          <div class="out" id="nowF"><small>지금 용적률 (연면적 ÷ 대지면적)</small><span></span><div class="bar"><i></i></div></div>
        </div>
        <div id="siteTbl"></div>
        ${extra}
        <h3>우리 조 계획</h3>
        ${TEAM_FIELDS[tid].map(([k,l,ty])=>`<label>${esc(l)}</label>${ty==='area'?`<textarea data-f="${k}"></textarea>`:`<input data-f="${k}">`}`).join('')}
      </div>
    </div>
    <datalist id="zones">${Object.keys(CAPS).map(z=>`<option value="${z}">`).join('')}</datalist>`;

  /* --- 평면 판 --- */
  const stage=$('#stage');
  const cBg=mkCanvas(), cOthers=mkCanvas(), cMine=mkCanvas(), cTmp=mkCanvas();
  [cBg,cOthers,cMine,cTmp].forEach(c=>stage.appendChild(c));
  cOthers.style.opacity=.28;
  drawBg(cBg.getContext('2d'));
  const xO=cOthers.getContext('2d'), xM=cMine.getContext('2d'), xT=cTmp.getContext('2d');
  const myData=()=>({strokes:st.strokes, sites:st.sites, bldgs:st.bldgs});
  function renderOthers(){ xO.clearRect(0,0,W,H); if(st.showOthers) others.forEach(o=>{ const c=mkCanvas(); drawLayer(c.getContext('2d'),o.data,o.t.color); xO.drawImage(c,0,0); }); }
  const renderMine=()=>drawLayer(xM, myData(), T.color);
  renderOthers(); renderMine();

  /* --- 입체 --- */
  let v3=null;
  const layers3d=()=>[
    ...(st.showOthers? others.map(o=>({color:o.t.color, ground:groundOf(o.data,o.t.color), bldgs:o.data.bldgs||[], alpha:.55})) : []),
    {color:T.color, ground:groundOf(myData(),T.color), bldgs:st.bldgs, alpha:1}
  ];
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    st.mode=b.dataset.mode; app.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));
    const is3=st.mode==='3d'; $('#stage').style.display=is3?'none':''; $('#stage3d').style.display=is3?'':'none';
    $('#planTools').style.display=is3?'none':''; $('#howto').style.display=is3?'none':'';
    if(is3){ if(!v3) v3=make3DView($('#stage3d'), layers3d); else v3.draw(); }
  });

  /* --- 계획표 --- */
  const inputs=[...app.querySelectorAll('[data-f]')];
  inputs.forEach(i=>{ i.value = st.fields[i.dataset.f] ?? ''; i.addEventListener('input', ()=>{ st.fields[i.dataset.f]=i.value; markDirty(); updateCalc(); }); });
  function updateCalc(){
    const f=st.fields, ev=evalTeam(f, myData());
    const cap=nationalCap(f), hint=$('#capHint');
    if(cap){
      const over=[]; if(num(f.bcr)>cap[0]) over.push('건폐율'); if(num(f.far)>cap[1]) over.push('용적률');
      hint.className='hint'+(over.length?' bad':'');
      hint.textContent=`국가 상한: 건폐율 ${cap[0]}% · 용적률 ${cap[1]}%`+(over.length?`  ⚠️ 입력한 ${over.join('·')}이(가) 국가 상한보다 커요! 조례 숫자를 다시 확인해요.`:'  (조례 숫자는 이보다 작거나 같아요)');
    } else { hint.className='hint'; hint.textContent = f.zone? '' : '용도지역을 고르면 국가 상한이 보여요.'; }
    $('#oSite').textContent = ev.siteArea? `${fmtN(ev.siteArea)} ㎡ (대지 ${ev.per.length}개)` : '대지를 그려 주세요';
    $('#oBuild').textContent = (ev.capB!=null&&ev.siteArea)? `${fmtN(ev.siteArea*ev.capB/100)} ㎡`:'―';
    $('#oFloor').textContent = (ev.capF!=null&&ev.siteArea)? `${fmtN(ev.siteArea*ev.capF/100)} ㎡`:'―';
    $('#oFloors').textContent = (ev.capB&&ev.capF!=null)? `${Math.floor(ev.capF/ev.capB)} 층`:'―';
    const setNow=(id,now,capv,area,unit)=>{ const el=$('#'+id); const bad=capv!=null&&now>capv+1e-9;
      el.classList.toggle('bad',bad); $('span',el).textContent = ev.siteArea? `${r1(now)}%${capv!=null?` / ${capv}%`:''}  (${fmtN(area)}㎡)`:'―';
      const i=$('i',el); i.style.width = capv? Math.min(100, now/capv*100)+'%':'0'; i.classList.toggle('bad',bad); };
    setNow('nowB', ev.bcrNow, ev.capB, ev.foot); setNow('nowF', ev.farNow, ev.capF, ev.gfa);
    $('#siteTbl').innerHTML = ev.per.length? `<table class="tbl" style="margin-top:8px"><tr><th>대지</th><th>면적</th><th>건물</th><th>건폐율</th><th>용적률</th></tr>${ev.per.map(p=>`<tr><td>대지${p.i}</td><td>${fmtN(p.area)}㎡</td><td>${p.n}채</td><td class="${p.overB?'bad':''}">${r1(p.bcr)}%</td><td class="${p.overF?'bad':''}">${r1(p.far)}%</td></tr>`).join('')}</table>`:'';
    if(tid==='landmark'){ const hl=num(f.hLimit), h=ev.maxFloors*FLOOR_M, out=$('#oHeight');
      out.textContent = ev.maxFloors? `${ev.maxFloors}층 = ${h} m` + (hl!=null?(h<=hl?'  ✅ 제한 안':'  ❌ 제한 초과'):'') : '―';
      $('#oHeightBox').classList.toggle('bad', hl!=null && h>hl); }
  }
  updateCalc();

  /* --- 도구 --- */
  function syncTools(){
    app.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on', b.dataset.tool===st.tool));
    app.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on', +b.dataset.w===st.width));
    app.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on', b.dataset.c===st.color));
  }
  app.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{st.tool=b.dataset.tool; syncTools();});
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{st.width=+b.dataset.w; syncTools();});
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.color=b.dataset.c; if(['eraser','site','bldg','select'].includes(st.tool)) st.tool='pen'; syncTools();});
  syncTools();
  $('#others').onchange=e=>{ st.showOthers=e.target.checked; renderOthers(); if(v3) v3.draw(); };

  /* --- 되돌리기 --- */
  const snapS=()=>JSON.stringify({s:st.strokes, si:st.sites, b:st.bldgs});
  const restore=j=>{ const o=JSON.parse(j); st.strokes=o.s; st.sites=o.si; st.bldgs=o.b; };
  function commit(fn){ st.hist.push(snapS()); if(st.hist.length>80) st.hist.shift(); st.fut=[]; fn(); changed(); }
  function changed(){ renderMine(); markDirty(); updateCalc(); if(v3&&st.mode==='3d') v3.draw(); }
  function undo(){ if(!st.hist.length) return; st.fut.push(snapS()); restore(st.hist.pop()); changed(); }
  function redo(){ if(!st.fut.length) return; st.hist.push(snapS()); restore(st.fut.pop()); changed(); }
  $('#undo').onclick=undo; $('#redo').onclick=redo;
  $('#clear').onclick=async()=>{
    if(!st.strokes.length && !st.sites.length && !st.bldgs.length) return;
    const r=await dialog({title:'전체 지우기', msg:'우리 조 그림 · 대지 · 건물을 모두 지울까요?\n(저장하기 전까지는 되돌리기로 살릴 수 있어요)', buttons:[['취소',false],['모두 지우기',true,'danger']]});
    if(r.btn) commit(()=>{ st.strokes=[]; st.sites=[]; st.bldgs=[]; });
  };

  /* --- 저장 상태 · 임시 저장 --- */
  function setStatus(){
    const el=$('#status'); if(!el) return;
    if(st.dirty){ el.className='status dirty'; el.textContent='● 저장 안 됨'; }
    else { el.className='status saved'; el.textContent = st.savedAt? `✓ 저장됨 ${fmtTime(st.savedAt)}`:'아직 저장 전'; }
  }
  let draftTimer=null;
  function markDirty(){ st.dirty=true; setStatus(); clearTimeout(draftTimer); draftTimer=setTimeout(()=>ls.set(draftKey,{...myData(),fields:st.fields,baseVersion:st.version,ts:Date.now()}),400); }
  setStatus();
  if(restored) toast('저장하지 않은 작업을 이 기기에서 불러왔어요. 꼭 저장하세요!');

  async function save(force){
    const ev=evalTeam(st.fields, myData());
    if(!force && ev.issues.length){
      const r=await dialog({title:'⚠️ 규칙을 넘은 건물이 있어요', bad:true, msg:ev.issues.join('\n')+'\n\n상한을 바꾸었거나 대지를 줄여서 생긴 문제예요. 건물 층수나 크기를 고쳐 주세요.', buttons:[['고치러 가기',false,'primary'],['그래도 저장',true]]});
      if(!r.btn) return;
    }
    const btn=$('#save'); btn.disabled=true; btn.textContent='저장 중…';
    const res=await apiPut(cls, tid, {data:{...myData(), fields:st.fields}, baseVersion:st.version, force, savedBy:st.fields.members||''});
    btn.disabled=false; btn.textContent='💾 저장';
    if(res.conflict){
      const pick=await dialog({title:'먼저 저장한 내용이 있어요', msg:`다른 기기에서 ${fmtTime(res.current?.savedAt)}에 먼저 저장했어요.\n어떻게 할까요?`,
        buttons:[['취소','cancel'],['저장된 것 불러오기','load'],['내 것으로 덮어쓰기','force','primary']]});
      if(pick.btn==='force') return save(true);
      if(pick.btn==='load'){ const c=res.current?.data||{}; st.strokes=c.strokes||[]; st.sites=c.sites||[]; st.bldgs=c.bldgs||[]; st.fields=c.fields||{};
        st.version=res.current?.version||0; st.savedAt=res.current?.savedAt; st.hist=[]; st.fut=[]; ls.del(draftKey);
        inputs.forEach(i=>i.value=st.fields[i.dataset.f]??''); renderMine(); updateCalc(); st.dirty=false; setStatus(); }
      return;
    }
    if(res.error){ toast('저장 실패: '+res.error+' — 인터넷 연결을 확인하고 다시 눌러 주세요'); return; }
    st.version=res.version; st.savedAt=res.savedAt; st.dirty=false; ls.del(draftKey); setStatus(); toast('저장했어요!');
  }
  $('#save').onclick=()=>save(false);

  /* --- 건물 규칙 검사 --- */
  function checkBldg(cand, ignoreId){
    const f=st.fields, capB=num(f.bcr), capF=num(f.far);
    if(capB==null||capF==null) return {err:'먼저 오른쪽 칸에 ③ 건폐율 상한과 ④ 용적률 상한을 입력해요.\n(3단계에서 조례로 찾은 숫자예요)'};
    const nc=nationalCap(f);
    if(nc && (capB>nc[0]||capF>nc[1])) return {err:`입력한 상한(건폐율 ${capB}% · 용적률 ${capF}%)이 국가 상한(${nc[0]}% · ${nc[1]}%)보다 커요.\n조례 숫자를 다시 확인해요.`};
    const si=st.sites.findIndex(s=>inside(cand,s));
    if(si<0) return {err:'건물은 점선으로 그린 대지 안에 지어야 해요.\n대지 밖으로 나가지 않게 다시 그려요.'};
    const rest=st.bldgs.filter(b=>b.id!==ignoreId);
    if(rest.some(b=>overlaps(b,cand))) return {err:'다른 건물과 겹쳐요. 빈 곳에 그려요.'};
    const site=st.sites[si], sArea=areaM2(site), fa=areaM2(cand);
    const inSite=rest.filter(b=>inside(b,site));
    const foot=inSite.reduce((a,b)=>a+areaM2(b),0)+fa, gfaOther=inSite.reduce((a,b)=>a+areaM2(b)*b.floors,0);
    const bcr=foot/sArea*100;
    if(bcr>capB+1e-9) return {err:`건폐율 초과!\n대지${si+1} 면적 ${fmtN(sArea)}㎡ 중 건물 바닥이 ${fmtN(foot)}㎡가 되어\n건폐율이 ${r1(bcr)}%예요. (상한 ${capB}%)\n\n건물 바닥을 더 작게 그려요. 이 대지에 남은 바닥 면적은 ${fmtN(Math.max(0,sArea*capB/100-(foot-fa)))}㎡예요.`, fatal:true};
    const maxByFar=Math.floor((sArea*capF/100-gfaOther)/fa+1e-9);
    const hl=tid==='landmark'?num(f.hLimit):null, maxByH=hl!=null?Math.floor(hl/FLOOR_M):Infinity;
    return {si, sArea, fa, gfaOther, maxF:Math.min(maxByFar,maxByH), maxByFar, maxByH, capF, hl};
  }
  async function askFloors(cand, info, current){
    let val=current||1;
    while(true){
      const r=await dialog({title:'🏢 몇 층으로 지을까요?', msg:`바닥 넓이 ${fmtN(info.fa)}㎡ · 대지${info.si+1}\n이 자리에 지을 수 있는 최대 층수: ${info.maxF>=1?info.maxF+'층':'없음'}`,
        inputs:[{k:'floors',label:'층수',type:'number',value:val},{k:'name',label:'건물 이름 (선택, 예: 우리 집, 시청)',value:cand.name||''}],
        buttons:[['취소',null],['짓기','ok','primary']]});
      if(r.btn!=='ok') return null;
      const fl=Math.floor(num(r.values.floors)||0);
      if(fl<1){ await dialog({title:'층수를 확인해요', bad:true, msg:'1층 이상으로 입력해요.'}); continue; }
      const gfa=info.gfaOther+info.fa*fl, far=gfa/info.sArea*100;
      if(far>info.capF+1e-9){
        await dialog({title:'⚠️ 용적률 초과! 지을 수 없어요', bad:true, msg:`${fl}층이면 연면적 ${fmtN(gfa)}㎡ → 용적률 ${r1(far)}%예요. (상한 ${info.capF}%)\n\n${info.maxByFar>=1?`이 자리에는 ${info.maxByFar}층까지 지을 수 있어요.`:'이 대지는 용적률이 꽉 찼어요. 다른 건물 층수를 줄이거나 바닥을 작게 그려요.'}`});
        val=Math.max(1,info.maxByFar); if(info.maxByFar<1) return null; continue;
      }
      if(info.hl!=null && fl*FLOOR_M>info.hl){
        await dialog({title:'⚠️ 높이 제한 초과! 지을 수 없어요', bad:true, msg:`${fl}층이면 높이 약 ${fl*FLOOR_M}m예요. 고도지구 제한은 ${info.hl}m라서\n${info.maxByH}층까지만 지을 수 있어요.`});
        val=Math.max(1,info.maxByH); continue;
      }
      return {floors:fl, name:(r.values.name||'').trim().slice(0,12)};
    }
  }
  async function addBldg(cand){
    const info=checkBldg(cand);
    if(info.err){ await dialog({title:'⚠️ 지을 수 없어요', bad:true, msg:info.err}); return; }
    if(info.maxF<1){ await dialog({title:'⚠️ 지을 수 없어요', bad:true, msg:info.maxByFar<1?'이 대지는 용적률이 꽉 찼어요.\n다른 건물 층수를 줄이거나 바닥을 작게 그려요.':'높이 제한 때문에 1층도 지을 수 없어요.'}); return; }
    const r=await askFloors(cand, info, 1); if(!r) return;
    commit(()=>st.bldgs.push({...cand, id:uid(), floors:r.floors, name:r.name}));
    toast(`${r.floors}층 건물을 지었어요!`);
  }
  async function editAt(p){
    const b=[...st.bldgs].reverse().find(b=>hit(b,p));
    if(b){
      const info=checkBldg(b, b.id);
      if(info.err && !info.fatal){ await dialog({title:'⚠️ 확인해요', bad:true, msg:info.err}); }
      const r=await dialog({title:`🏢 ${b.name||'건물'} · ${b.floors}층`, msg:`바닥 넓이 ${fmtN(areaM2(b))}㎡`, buttons:[['닫기',null],['삭제','del','danger'],['층수·이름 바꾸기','edit','primary']]});
      if(r.btn==='del') commit(()=>{ st.bldgs=st.bldgs.filter(x=>x.id!==b.id); });
      if(r.btn==='edit'){
        if(info.err){ await dialog({title:'⚠️ 바꿀 수 없어요', bad:true, msg:info.err+'\n\n건물을 지우고 다시 지어요.'}); return; }
        const n=await askFloors(b, info, b.floors); if(!n) return;
        commit(()=>{ const x=st.bldgs.find(x=>x.id===b.id); x.floors=n.floors; x.name=n.name; });
      }
      return;
    }
    const si=st.sites.findIndex(s=>hit(s,p));
    if(si>=0){
      const s=st.sites[si], cnt=st.bldgs.filter(b=>inside(b,s)).length;
      const r=await dialog({title:`대지${si+1} · ${fmtN(areaM2(s))}㎡`, msg: cnt?`이 대지에 건물 ${cnt}채가 있어요. 대지를 지우면 건물도 함께 지워져요.`:'빈 대지예요.', buttons:[['닫기',null],['대지 삭제','del','danger']]});
      if(r.btn==='del') commit(()=>{ st.bldgs=st.bldgs.filter(b=>!inside(b,s)); st.sites=st.sites.filter(x=>x.id!==s.id); });
      return;
    }
    toast('건물이나 대지를 눌러요');
  }

  /* --- 마우스 · 터치 --- */
  let cur=null;
  const pt=e=>{ const r=cTmp.getBoundingClientRect(); return [Math.round(Math.min(W,Math.max(0,(e.clientX-r.left)*W/r.width))), Math.round(Math.min(H,Math.max(0,(e.clientY-r.top)*H/r.height)))]; };
  stage.addEventListener('pointerdown', async e=>{
    if(e.button>0) return;
    const p=pt(e);
    if(st.tool==='select') return editAt(p);
    if(st.tool==='text'){
      const r=await dialog({title:'🔤 글자 쓰기', inputs:[{k:'t',label:'판 위에 쓸 글자 (예: 시청, 중앙공원)'}], buttons:[['취소',null],['쓰기','ok','primary']]});
      const text=(r.values?.t||'').trim(); if(r.btn!=='ok'||!text) return;
      commit(()=>st.strokes.push({t:'text', a:p, text:text.slice(0,40), c:st.color, size:Math.max(20, st.width*4)})); return;
    }
    stage.setPointerCapture(e.pointerId);
    if(st.tool==='site'||st.tool==='bldg'){ const q=[snap(p[0]),snap(p[1])]; cur={t:st.tool, a:q, b:q}; }
    else if(st.tool==='pen'||st.tool==='eraser') cur={t:st.tool, c:st.color, w:st.tool==='eraser'?st.width*3:st.width, p:[...p]};
    else cur={t:st.tool, c:st.color, w:st.width, a:p, b:p};
    preview();
  });
  stage.addEventListener('pointermove', e=>{
    if(!cur) return; const p=pt(e);
    if(cur.p){ const n=cur.p.length; if(Math.hypot(p[0]-cur.p[n-2], p[1]-cur.p[n-1])>=2) cur.p.push(p[0],p[1]); }
    else if(cur.t==='site'||cur.t==='bldg') cur.b=[snap(p[0]),snap(p[1])];
    else cur.b=p;
    preview();
  });
  const end=async()=>{
    if(!cur) return; const c=cur; cur=null; xT.clearRect(0,0,W,H);
    if(c.t==='site'||c.t==='bldg'){
      const r=rectOf(c); if(r.w<SNAP||r.h<SNAP){ renderMine(); return; }
      const o={a:[r.x,r.y], b:[r.x+r.w,r.y+r.h]};
      if(c.t==='site'){
        if(st.sites.some(s=>overlaps(s,o))){ await dialog({title:'⚠️ 대지가 겹쳐요', bad:true, msg:'대지끼리 겹치면 안 돼요. 빈 곳에 그려요.'}); return; }
        commit(()=>st.sites.push({...o, id:uid()})); toast(`대지${st.sites.length} · ${fmtN(areaM2(o))}㎡`);
      } else await addBldg(o);
      return;
    }
    if(c.t==='eraser'){ renderMine(); }
    st.hist.push(snapS()); st.fut=[]; st.strokes.push(c); changed();
  };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  function preview(){
    if(cur.t==='eraser'){ renderMine(); xM.save(); drawStroke(xM,cur); xM.restore(); return; }
    xT.clearRect(0,0,W,H);
    if(cur.t==='site'||cur.t==='bldg'){
      const r=rectOf(cur), m2=r.w*r.h/(PX_PER_M*PX_PER_M);
      xT.save(); xT.setLineDash(cur.t==='site'?[12,8]:[]); xT.lineWidth=3; xT.strokeStyle=T.color; xT.fillStyle=T.color; xT.globalAlpha=cur.t==='site'?.08:.4;
      xT.fillRect(r.x,r.y,r.w,r.h); xT.globalAlpha=1; xT.strokeRect(r.x,r.y,r.w,r.h);
      xT.font="700 16px 'Noto Sans KR', sans-serif"; xT.fillStyle='#1d2533'; xT.fillText(`${r.w/PX_PER_M}m × ${r.h/PX_PER_M}m = ${fmtN(m2)}㎡`, r.x+4, r.y-8<14?r.y+r.h+18:r.y-8);
      xT.restore(); return;
    }
    drawStroke(xT,cur);
  }
  const key=e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); e.shiftKey?redo():undo(); } };
  const before=e=>{ if(st.dirty){ e.preventDefault(); e.returnValue=''; } };
  window.addEventListener('keydown',key); window.addEventListener('beforeunload',before);
  cleanup=()=>{ window.removeEventListener('keydown',key); window.removeEventListener('beforeunload',before); };
}

async function overlayPage(app, cls){
  setCrumb([['반 선택','#'],[clsName(cls),`#/c/${cls}`],['겹쳐 보기']]);
  app.innerHTML = `<p class="muted">불러오는 중…</p>`;
  const vis = ls.get('overlayVis') || {};
  let mode='plan';
  async function load(){
    const d = await apiGet(cls);
    const city = d?.meta?.data?.city;
    const data = id => d?.teams?.[id]?.data || {};
    const fields = id => data(id).fields || {};
    app.innerHTML = `${banner()}
      <h2>${clsName(cls)} 도시 완성도 ${city?`— <span style="color:var(--ink)">${esc(city)}</span>`:''}</h2>
      <div class="workspace">
        <div>
          <div class="tabs"><button data-mode="plan">🗺️ 평면 겹쳐 보기</button><button data-mode="3d">🧊 입체 보기</button></div>
          <div class="stage" id="stage"></div>
          <div class="stage" id="stage3d" style="display:none"></div>
          <div class="toolbar" style="margin-top:8px">
            <button class="btn" id="reload">🔄 새로 불러오기</button>
            <button class="btn primary" id="png">🖼️ 지금 화면 이미지로 저장</button>
          </div>
        </div>
        <div class="card">
          <h3 style="margin-top:0">조별 필름 (켜기/끄기 · 진하기)</h3>
          <div class="layers">${TEAMS.map(t=>{ const r=d?.teams?.[t.id]; const v=vis[t.id]||{on:true,a:100};
            return `<div class="layer" style="--c:${t.color}">
              <label><input type="checkbox" data-on="${t.id}" ${v.on?'checked':''}> <b>${t.name}</b></label>
              <span class="muted">${r?'저장 '+fmtTime(r.savedAt):'저장 없음'}</span>
              <span class="muted">진하기</span><input type="range" min="10" max="100" value="${v.a}" data-a="${t.id}">
            </div>`;}).join('')}
          </div>
          <p class="muted">필름은 녹지(맨 아래) → 교통 → 주거 → 상업 → 랜드마크(맨 위) 순서로 쌓여요.</p>
        </div>
      </div>
      <h3>6단계 · 겹쳐서 확인하기 (자동 체크)</h3>
      <ul class="checks" id="checks"></ul>
      <h3>조별 규칙 확인표</h3>
      <div style="overflow-x:auto"><table class="sum"><tr><th>조</th><th>용도지역</th><th>용도지구</th><th>대지면적</th><th>건물</th><th>건폐율 (지금 / 상한)</th><th>용적률 (지금 / 상한)</th><th>최고 층수</th><th>판정</th></tr>
        ${TEAMS.map(t=>{ const f=fields(t.id), ev=evalTeam(f, data(t.id));
          const judge = !ev.nB ? '―' : ev.issues.length ? '❌ '+esc(ev.issues[0]) : (ev.capB==null||ev.capF==null) ? '― (상한 없음)' : '✅ 통과';
          return `<tr><td><span class="dot" style="--c:${t.color}"></span>${t.name}</td><td>${esc(f.zone)||'―'}</td><td>${esc(f.district)||'―'}</td>
            <td>${ev.siteArea?fmtN(ev.siteArea)+'㎡':'―'}</td><td>${ev.nB}채</td>
            <td>${ev.siteArea?r1(ev.bcrNow)+'%':'―'} / ${ev.capB!=null?ev.capB+'%':'―'}</td>
            <td>${ev.siteArea?r1(ev.farNow)+'%':'―'} / ${ev.capF!=null?ev.capF+'%':'―'}</td>
            <td>${ev.maxFloors?ev.maxFloors+'층':'―'}</td><td>${judge}</td></tr>`;}).join('')}
      </table></div>`;

    // 6단계 자동 체크
    const ck=[];
    ck.push('✅ 기준점(+) — 모든 조가 같은 판에 그려서 자동으로 맞아요.');
    const bad=TEAMS.filter(t=>evalTeam(fields(t.id),data(t.id)).issues.length);
    ck.push(bad.length? `❌ 건폐율·용적률 — 규칙을 넘은 조: ${bad.map(t=>t.name).join(', ')}` : '✅ 건폐율·용적률 — 모든 조가 상한 안이에요.');
    const lmEv=evalTeam(fields('landmark'),data('landmark')), hl=num(fields('landmark').hLimit);
    ck.push(!lmEv.nB? '― 랜드마크 높이 — 아직 랜드마크 건물이 없어요.' : hl==null? `✅ 랜드마크 높이 — ${lmEv.maxFloors*FLOOR_M}m (고도지구 제한 없음)` : (lmEv.maxFloors*FLOOR_M<=hl? `✅ 랜드마크 높이 — ${lmEv.maxFloors*FLOOR_M}m ≤ 제한 ${hl}m` : `❌ 랜드마크 높이 — ${lmEv.maxFloors*FLOOR_M}m > 제한 ${hl}m`));
    const gArea=evalTeam(fields('green'),data('green')).siteArea, gNow=gArea/BOARD_AREA*100, gGoal=num(fields('green').gRatio);
    ck.push(!gArea? '― 녹지 비율 — 녹지조가 아직 대지(녹지)를 그리지 않았어요.' : `${gGoal==null||gNow>=gGoal?'✅':'❌'} 녹지 비율 — 지금 ${r1(gNow)}% (판 전체 ${fmtN(BOARD_AREA)}㎡ 중 ${fmtN(gArea)}㎡)${gGoal!=null?` · 목표 ${gGoal}%`:''}`);
    const all=[]; TEAMS.forEach(t=>(data(t.id).bldgs||[]).forEach(b=>all.push({t,b})));
    const clash=[]; for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++) if(all[i].t.id!==all[j].t.id && overlaps(all[i].b,all[j].b)) clash.push(`${all[i].t.name}–${all[j].t.name}`);
    ck.push(clash.length? `❌ 건물 겹침 — 다른 조 건물끼리 겹쳐요: ${[...new Set(clash)].join(', ')}` : '✅ 건물 겹침 — 조끼리 겹치는 건물이 없어요.');
    ck.push('☐ 도로와 건물이 겹치지 않고, 모든 집이 도로에 닿는가? — 평면에서 눈으로 확인해요.');
    $('#checks').innerHTML = ck.map(c=>`<li>${esc(c)}</li>`).join('');

    // 평면
    const stage=$('#stage'); const bg=mkCanvas(); stage.appendChild(bg); drawBg(bg.getContext('2d'));
    const layers={};
    STACK.forEach(id=>{ const c=mkCanvas(); stage.appendChild(c); drawLayer(c.getContext('2d'), data(id), TEAM[id].color); layers[id]=c; });
    const grounds=Object.fromEntries(STACK.map(id=>[id, groundOf(data(id), TEAM[id].color)]));
    const layers3d=()=>STACK.filter(id=>(vis[id]||{on:true}).on).map(id=>({color:TEAM[id].color, ground:grounds[id], bldgs:data(id).bldgs||[], alpha:(vis[id]?.a??100)/100}));
    let v3=null;
    function apply(){ TEAMS.forEach(t=>{ const v=vis[t.id]||{on:true,a:100}; layers[t.id].style.display=v.on?'':'none'; layers[t.id].style.opacity=v.a/100; }); ls.set('overlayVis',vis); if(v3) v3.draw(); }
    app.querySelectorAll('[data-on]').forEach(i=>i.onchange=()=>{ const id=i.dataset.on; vis[id]={...(vis[id]||{a:100}), on:i.checked}; apply(); });
    app.querySelectorAll('[data-a]').forEach(i=>i.oninput=()=>{ const id=i.dataset.a; vis[id]={...(vis[id]||{on:true}), a:+i.value}; apply(); });
    function setMode(m){ mode=m; app.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));
      $('#stage').style.display=m==='3d'?'none':''; $('#stage3d').style.display=m==='3d'?'':'none';
      if(m==='3d'){ if(!v3) v3=make3DView($('#stage3d'), layers3d); else v3.draw(); } }
    app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    apply(); setMode(mode);
    $('#reload').onclick=load;
    $('#png').onclick=()=>{
      let out;
      if(mode==='3d'){ out=$('#stage3d canvas'); }
      else { out=mkCanvas(); const x=out.getContext('2d'); x.drawImage(bg,0,0);
        STACK.forEach(id=>{ const v=vis[id]||{on:true,a:100}; if(!v.on) return; x.globalAlpha=v.a/100; x.drawImage(layers[id],0,0); }); x.globalAlpha=1; }
      const o2=mkCanvas(out.width,out.height), x2=o2.getContext('2d'); x2.fillStyle='#fff'; x2.fillRect(0,0,o2.width,o2.height); x2.drawImage(out,0,0);
      x2.font="700 30px 'Noto Sans KR', sans-serif"; x2.fillStyle='#1f3864'; x2.fillText(`${clsName(cls)} ${city||''} 도시 계획`, 60, 70);
      o2.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`${clsName(cls).replace(/ /g,'')}_도시계획_${mode==='3d'?'입체':'평면'}.png`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); });
    };
  }
  await load();
}

window.addEventListener('hashchange', route);
route();
</script>
